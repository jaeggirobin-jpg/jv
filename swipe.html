<!DOCTYPE html>
<html lang="de-CH"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Inspiration entdecken — Jäggi Vollmer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
/* ========================================================
   JÄGGI VOLLMER — Swipe-Inspiration (TikTok-Style)
   Dark Theme, vertikal, vollbild
   ======================================================== */

:root {
  --bg: #111;
  --card-bg: #111;
  --gold: #BF853B;
  --gold-light: #d4a85a;
  --text: #fff;
  --text-muted: rgba(255,255,255,0.6);
  --text-dim: rgba(255,255,255,0.4);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "DM Sans", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* Scrollbar ausblenden */
.swipe-container::-webkit-scrollbar { display: none; }
.swipe-container {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* ============== SWIPE CONTAINER ============== */
.swipe-container {
  height: 100vh;
  height: 100dvh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
}

/* ============== CARD (Vollbild) ============== */
.swipe-card {
  position: relative;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

/* Desktop-Zentrierung */
@media (min-width: 501px) {
  .swipe-container {
    max-width: 500px;
    margin: 0 auto;
    box-shadow: 0 0 80px rgba(0,0,0,0.5);
  }
}

/* ============== HINTERGRUNDBILD / VIDEO ============== */
.swipe-card__bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-color: #1a1a1a;
  z-index: 0;
  will-change: transform;
  transition: transform 0.1s linear;
}

.swipe-card__bg video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Gradient-Platzhalter wenn kein Bild */
.swipe-card__bg--placeholder {
  background: linear-gradient(135deg, #1a1612 0%, #2a2118 40%, #1f1a14 100%);
}

/* ============== GRADIENT OVERLAY ============== */
.swipe-card__gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.15) 0%,
    rgba(0,0,0,0) 30%,
    rgba(0,0,0,0) 40%,
    rgba(0,0,0,0.55) 70%,
    rgba(0,0,0,0.85) 100%
  );
  z-index: 1;
  pointer-events: none;
}

/* ============== INHALT UNTEN ============== */
.swipe-card__content {
  position: relative;
  z-index: 2;
  padding: 0 16px 28px;
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0));
  max-width: 100%;
  /* Platz für Action-Buttons rechts */
  padding-right: 72px;
}

.swipe-card__category {
  display: inline-block;
  padding: 4px 12px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold-light);
  margin-bottom: 10px;
}

.swipe-card__title {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 6px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}

.swipe-card__desc {
  font-size: 14px;
  line-height: 1.5;
  color: rgba(255,255,255,0.85);
  text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Expandierter Zustand */
.swipe-card__content.expanded .swipe-card__desc {
  -webkit-line-clamp: unset;
  overflow: visible;
}

.swipe-card__details {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s var(--ease), opacity 0.3s ease;
  opacity: 0;
}

.swipe-card__content.expanded .swipe-card__details {
  max-height: 400px;
  opacity: 1;
  margin-top: 12px;
}

.swipe-card__detail-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 13px;
  line-height: 1.5;
  color: rgba(255,255,255,0.8);
  margin-bottom: 8px;
}

.swipe-card__detail-label {
  color: var(--gold-light);
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

.swipe-card__expand-hint {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 6px;
  transition: opacity 0.2s ease;
}

.swipe-card__content.expanded .swipe-card__expand-hint {
  opacity: 0;
}

/* ============== ACTION BUTTONS (rechts, vertikal) ============== */
.swipe-card__actions {
  position: absolute;
  right: 12px;
  bottom: 140px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}

.action-btn__icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  transition: transform 0.2s var(--ease), background 0.2s ease;
}

.action-btn__icon svg {
  width: 22px;
  height: 22px;
}

.action-btn__label {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
}

/* Herz-Button */
.action-btn--heart .action-btn__icon {
  transition: transform 0.3s var(--ease), background 0.2s ease;
}

.action-btn--heart.liked .action-btn__icon {
  background: rgba(191, 133, 59, 0.25);
}

.action-btn--heart.liked svg {
  fill: var(--gold);
  stroke: var(--gold);
}

.action-btn--heart.bounce .action-btn__icon {
  animation: heartBounce 0.4s var(--ease);
}

@keyframes heartBounce {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.35); }
  60%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}

/* Kommentar-Dot */
.action-btn--comment {
  position: relative;
}

.action-btn--comment .comment-dot {
  position: absolute;
  top: -2px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0;
  transform: scale(0);
  transition: opacity 0.2s ease, transform 0.2s var(--ease);
}

.action-btn--comment.has-comment .comment-dot {
  opacity: 1;
  transform: scale(1);
}

/* ============== DOUBLE-TAP HERZ (Mitte) ============== */
.double-tap-heart {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 100;
  pointer-events: none;
  opacity: 0;
}

.double-tap-heart svg {
  width: 100px;
  height: 100px;
  fill: var(--gold);
  filter: drop-shadow(0 4px 20px rgba(191, 133, 59, 0.5));
}

.double-tap-heart.show {
  animation: doubleTapHeart 0.9s var(--ease-out) forwards;
}

@keyframes doubleTapHeart {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0); }
  15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
  30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
  70%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
}

/* ============== POSITIONSANZEIGE ============== */
.position-indicator {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 50;
  padding: 6px 14px;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  font-variant-numeric: tabular-nums;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

/* ============== INTRO-CARD ============== */
.intro-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 32px;
}

.intro-card__bg {
  background: linear-gradient(160deg, #1a1612 0%, #2a2118 50%, #1a1612 100%);
}

.intro-card__eyebrow {
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadeUp 0.8s var(--ease) 0.2s forwards;
}

.intro-card__greeting {
  font-size: clamp(28px, 7vw, 38px);
  font-weight: 700;
  line-height: 1.12;
  margin-bottom: 16px;
  opacity: 0;
  animation: fadeUp 0.8s var(--ease) 0.35s forwards;
}

.intro-card__greeting em {
  color: var(--gold-light);
  font-style: normal;
}

.intro-card__sub {
  font-size: 15px;
  line-height: 1.65;
  color: var(--text-muted);
  max-width: 320px;
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.8s var(--ease) 0.5s forwards;
}

.intro-card__scroll-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.06em;
  opacity: 0;
  animation: fadeUp 0.8s var(--ease) 0.7s forwards;
}

.intro-card__scroll-arrow {
  width: 24px;
  height: 24px;
  animation: scrollBounce 2s var(--ease) infinite;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes scrollBounce {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(8px); }
}

/* Link zur Uebersicht */
.intro-card__overview-link {
  margin-top: 28px;
  font-size: 13px;
  color: var(--gold);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  opacity: 0;
  animation: fadeUp 0.8s var(--ease) 0.85s forwards;
  transition: color 0.2s ease;
}

.intro-card__overview-link:hover {
  color: var(--gold-light);
}

/* ============== BOTTOM SHEET (Kommentar) ============== */
.bottom-sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.bottom-sheet-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.bottom-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 210;
  background: #1c1c1e;
  border-radius: 20px 20px 0 0;
  padding: 0 20px 20px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0));
  transform: translateY(100%);
  transition: transform 0.4s var(--ease-out);
  max-height: 70vh;
  display: flex;
  flex-direction: column;
}

@media (min-width: 501px) {
  .bottom-sheet {
    max-width: 500px;
    margin: 0 auto;
  }
}

.bottom-sheet.open {
  transform: translateY(0);
}

.bottom-sheet__handle {
  width: 36px;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 10px auto 16px;
  flex-shrink: 0;
}

.bottom-sheet__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.bottom-sheet__title {
  font-size: 16px;
  font-weight: 600;
}

.bottom-sheet__close {
  background: rgba(255,255,255,0.1);
  border: none;
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 16px;
}

.bottom-sheet__textarea {
  width: 100%;
  min-height: 120px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.06);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  line-height: 1.55;
  resize: none;
  outline: none;
  transition: border-color 0.2s ease;
}

.bottom-sheet__textarea:focus {
  border-color: var(--gold);
}

.bottom-sheet__textarea::placeholder {
  color: var(--text-dim);
}

.bottom-sheet__saved {
  font-size: 12px;
  color: var(--gold);
  margin-top: 8px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.bottom-sheet__saved.visible {
  opacity: 1;
}

/* ============== TOAST ============== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 300;
  padding: 10px 24px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s var(--ease);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============== ERROR STATE ============== */
.error-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  text-align: center;
  padding: 2rem;
  background: var(--bg);
}

.error-screen__inner {
  max-width: 340px;
}

.error-screen h2 {
  color: var(--gold);
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 12px;
}

.error-screen p {
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.65;
}

.error-screen a {
  color: var(--gold);
  text-decoration: none;
}

.error-screen__retry {
  margin-top: 20px;
  padding: 12px 28px;
  background: var(--gold);
  color: #111;
  border: none;
  border-radius: 999px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s ease;
}

.error-screen__retry:hover {
  background: var(--gold-light);
}

/* ============== LOADING ============== */
.loading-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
}

.loading-spinner {
  width: 32px;
  height: 32px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============== REDUCED MOTION ============== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>

<body>

<!-- Lade-Bildschirm -->
<div class="loading-screen" id="loading">
  <div class="loading-spinner"></div>
</div>

<!-- Haupt-Container (wird von JS befuellt) -->
<div class="swipe-container" id="swipe-container" style="display:none"></div>

<!-- Positionsanzeige -->
<div class="position-indicator" id="position" style="display:none">1 / 1</div>

<!-- Double-Tap Herz -->
<div class="double-tap-heart" id="double-tap-heart">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
  </svg>
</div>

<!-- Bottom Sheet (Kommentar) -->
<div class="bottom-sheet-overlay" id="sheet-overlay"></div>
<div class="bottom-sheet" id="bottom-sheet">
  <div class="bottom-sheet__handle"></div>
  <div class="bottom-sheet__header">
    <div class="bottom-sheet__title">Notiz</div>
    <button class="bottom-sheet__close" id="sheet-close">&times;</button>
  </div>
  <textarea class="bottom-sheet__textarea" id="sheet-textarea" placeholder="Was ist Ihnen dabei wichtig?"></textarea>
  <div class="bottom-sheet__saved" id="sheet-saved">Gespeichert</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SUPABASE + KUNDENDATEN
   ============================================================ */
const SUPABASE_URL = 'https://ywcnccpjhnnspbkcmpng.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3Y25jY3BqaG5uc3Bia2NtcG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTg4MTMsImV4cCI6MjA5MTY5NDgxM30.xylQ_9hBQsKNIJJrXU6hTr6T2uSnYq62OPV7HZf-0-Y';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const token = new URLSearchParams(location.search).get('t') || '';

/* ============================================================
   STATE
   ============================================================ */
const state = {
  liked: new Map(),       // punkt_id -> boolean
  notes: new Map(),       // punkt_id -> string
  punkte: [],             // alle Punkte (flach)
  kunde: null,
  kategorien: {},         // id -> { titel, intro }
  currentIndex: 0,        // aktueller Kartenindex (0 = Intro)
  totalCards: 0,
  _noteTimers: new Map(),
};

/* ============================================================
   HILFSFUNKTIONEN
   ============================================================ */
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"]/g, function(m) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
  });
}

function getGreeting(k) {
  if (!k) return '';
  if (k.anrede_typ === 'familie') return 'Familie ' + k.nachname;
  var anredeMap = { frau: 'Frau', herr: 'Herr' };
  return (anredeMap[k.anrede_typ] || '') + ' ' + k.nachname;
}

function showToast(text) {
  var el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(function() { el.classList.remove('show'); }, 2000);
}

function getCategoryTitle(kategorieId) {
  var meta = state.kategorien[kategorieId];
  if (meta) return meta.titel;
  return kategorieId ? (kategorieId.charAt(0).toUpperCase() + kategorieId.slice(1)) : '';
}

/* ============================================================
   KARTEN RENDERN
   ============================================================ */
function renderCards() {
  var container = document.getElementById('swipe-container');
  var html = '';

  // Intro-Karte
  var greeting = getGreeting(state.kunde);
  html += '<div class="swipe-card intro-card" data-index="0">' +
    '<div class="swipe-card__bg intro-card__bg"></div>' +
    '<div class="intro-card__eyebrow">Willkommen</div>' +
    '<div class="intro-card__greeting">' + escapeHtml(greeting) + ',<br>entdecken Sie <em>Ihr Bad.</em></div>' +
    '<div class="intro-card__sub">Wischen Sie nach oben, um Inspirationen zu entdecken. Tippen Sie auf das Herz, wenn Ihnen etwas gefällt.</div>' +
    '<div class="intro-card__scroll-hint">' +
      '<span>Nach oben wischen</span>' +
      '<svg class="intro-card__scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>' +
    '</div>' +
    '<a class="intro-card__overview-link" href="/inspiration.html?t=' + encodeURIComponent(token) + '">Zur Übersicht &rarr;</a>' +
  '</div>';

  // Inspirations-Karten
  for (var i = 0; i < state.punkte.length; i++) {
    var p = state.punkte[i];
    var idx = i + 1; // +1 wegen Intro-Karte
    var isLiked = state.liked.get(p.id) || false;
    var hasNote = state.notes.has(p.id) && state.notes.get(p.id).length > 0;
    var hasBild = !!p.bild_url;
    var hasVideo = !!p.video_url;
    var catTitle = getCategoryTitle(p.kategorie);

    html += '<div class="swipe-card" data-index="' + idx + '" data-punkt-id="' + p.id + '">';

    // Hintergrund
    if (hasVideo) {
      html += '<div class="swipe-card__bg">' +
        '<video src="' + escapeHtml(p.video_url) + '" muted loop playsinline preload="metadata" poster="' + escapeHtml(p.bild_url || '') + '"></video>' +
      '</div>';
    } else if (hasBild) {
      html += '<div class="swipe-card__bg" style="background-image:url(\'' + escapeHtml(p.bild_url) + '\')"></div>';
    } else {
      html += '<div class="swipe-card__bg swipe-card__bg--placeholder"></div>';
    }

    // Gradient-Overlay
    html += '<div class="swipe-card__gradient"></div>';

    // Action-Buttons (rechts)
    html += '<div class="swipe-card__actions">';

    // Herz
    html += '<button class="action-btn action-btn--heart' + (isLiked ? ' liked' : '') + '" data-heart="' + p.id + '" aria-label="' + (isLiked ? 'Nicht mehr interessiert' : 'Interessiert') + '">' +
      '<div class="action-btn__icon">' +
        '<svg viewBox="0 0 24 24" fill="' + (isLiked ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>' +
        '</svg>' +
      '</div>' +
    '</button>';

    // Kommentar
    html += '<button class="action-btn action-btn--comment' + (hasNote ? ' has-comment' : '') + '" data-comment="' + p.id + '" aria-label="Notiz">' +
      '<span class="comment-dot"></span>' +
      '<div class="action-btn__icon">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>' +
        '</svg>' +
      '</div>' +
    '</button>';

    // Teilen
    html += '<button class="action-btn action-btn--share" data-share aria-label="Teilen">' +
      '<div class="action-btn__icon">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>' +
        '</svg>' +
      '</div>' +
    '</button>';

    html += '</div>'; // .swipe-card__actions

    // Inhalt (unten)
    html += '<div class="swipe-card__content" data-content="' + p.id + '">';
    html += '<div class="swipe-card__category">' + escapeHtml(catTitle) + '</div>';
    html += '<div class="swipe-card__title">' + escapeHtml(p.titel) + '</div>';
    html += '<div class="swipe-card__desc">' + escapeHtml(p.kurzbeschreibung) + '</div>';

    // Erweiterbare Details
    if (p.vorteil || p.zu_bedenken) {
      html += '<div class="swipe-card__details">';
      if (p.vorteil) {
        html += '<div class="swipe-card__detail-item"><span class="swipe-card__detail-label">Vorteil:</span><span>' + escapeHtml(p.vorteil) + '</span></div>';
      }
      if (p.zu_bedenken) {
        html += '<div class="swipe-card__detail-item"><span class="swipe-card__detail-label">Zu bedenken:</span><span>' + escapeHtml(p.zu_bedenken) + '</span></div>';
      }
      html += '</div>';
      html += '<div class="swipe-card__expand-hint">Antippen für Details</div>';
    }

    html += '</div>'; // .swipe-card__content
    html += '</div>'; // .swipe-card
  }

  container.innerHTML = html;
  state.totalCards = state.punkte.length + 1; // +1 fuer Intro
}

/* ============================================================
   POSITIONSANZEIGE
   ============================================================ */
function updatePosition() {
  var el = document.getElementById('position');
  // Intro-Karte nicht mitzaehlen in der Anzeige
  if (state.currentIndex === 0) {
    el.style.opacity = '0';
  } else {
    el.style.opacity = '1';
    el.textContent = state.currentIndex + ' / ' + state.punkte.length;
  }
}

/* ============================================================
   LIKE / UNLIKE (Interessiert-Toggle)
   ============================================================ */
function toggleLike(punktId, fromDoubleTap) {
  var wasLiked = state.liked.get(punktId) || false;
  var newVal = !wasLiked;

  // Bei Double-Tap nur liken, nicht un-liken
  if (fromDoubleTap && wasLiked) return;

  // Optimistisch: sofort UI updaten
  state.liked.set(punktId, newVal);
  updateHeartUI(punktId, newVal);

  // Bounce-Animation
  var btn = document.querySelector('[data-heart="' + punktId + '"]');
  if (btn) {
    btn.classList.remove('bounce');
    void btn.offsetWidth;
    btn.classList.add('bounce');
    setTimeout(function() { btn.classList.remove('bounce'); }, 450);
  }

  // Supabase-Persistenz
  if (token) {
    sb.rpc('upsert_interesse', {
      p_token: token,
      p_punkt_id: punktId,
      p_interessiert: newVal
    }).then(function(res) {
      if (res.error) {
        // Rollback
        state.liked.set(punktId, wasLiked);
        updateHeartUI(punktId, wasLiked);
      }
    });
  }
}

function updateHeartUI(punktId, isLiked) {
  var btn = document.querySelector('[data-heart="' + punktId + '"]');
  if (!btn) return;
  var svg = btn.querySelector('svg');
  if (isLiked) {
    btn.classList.add('liked');
    svg.setAttribute('fill', 'currentColor');
    btn.setAttribute('aria-label', 'Nicht mehr interessiert');
  } else {
    btn.classList.remove('liked');
    svg.setAttribute('fill', 'none');
    btn.setAttribute('aria-label', 'Interessiert');
  }
}

/* ============================================================
   DOUBLE-TAP ERKENNUNG
   ============================================================ */
function setupDoubleTap() {
  var lastTap = 0;
  var lastX = 0;
  var lastY = 0;
  var container = document.getElementById('swipe-container');

  container.addEventListener('touchend', function(e) {
    // Nicht auf Buttons oder Content reagieren
    if (e.target.closest('.action-btn') || e.target.closest('.swipe-card__content') || e.target.closest('.intro-card')) return;

    var now = Date.now();
    var touch = e.changedTouches[0];
    var x = touch.clientX;
    var y = touch.clientY;

    if (now - lastTap < 350 && Math.abs(x - lastX) < 40 && Math.abs(y - lastY) < 40) {
      // Double-Tap erkannt
      var card = e.target.closest('.swipe-card[data-punkt-id]');
      if (card) {
        var punktId = card.dataset.punktId;
        toggleLike(punktId, true);
        showDoubleTapHeart();
      }
      lastTap = 0;
    } else {
      lastTap = now;
      lastX = x;
      lastY = y;
    }
  }, { passive: true });

  // Desktop: Doppelklick
  container.addEventListener('dblclick', function(e) {
    if (e.target.closest('.action-btn') || e.target.closest('.swipe-card__content') || e.target.closest('.intro-card')) return;
    var card = e.target.closest('.swipe-card[data-punkt-id]');
    if (card) {
      toggleLike(card.dataset.punktId, true);
      showDoubleTapHeart();
    }
  });
}

function showDoubleTapHeart() {
  var el = document.getElementById('double-tap-heart');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(function() { el.classList.remove('show'); }, 950);
}

/* ============================================================
   KOMMENTAR (Bottom Sheet)
   ============================================================ */
var currentCommentPunktId = null;

function openCommentSheet(punktId) {
  currentCommentPunktId = punktId;
  var ta = document.getElementById('sheet-textarea');
  ta.value = state.notes.get(punktId) || '';
  document.getElementById('bottom-sheet').classList.add('open');
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('sheet-saved').classList.remove('visible');
  setTimeout(function() { ta.focus(); }, 400);
}

function closeCommentSheet() {
  document.getElementById('bottom-sheet').classList.remove('open');
  document.getElementById('sheet-overlay').classList.remove('open');
  currentCommentPunktId = null;
}

function setupCommentSheet() {
  document.getElementById('sheet-close').addEventListener('click', closeCommentSheet);
  document.getElementById('sheet-overlay').addEventListener('click', closeCommentSheet);

  var ta = document.getElementById('sheet-textarea');
  ta.addEventListener('input', function() {
    if (!currentCommentPunktId) return;
    var text = (ta.value || '').trim();
    var punktId = currentCommentPunktId;

    if (text) {
      state.notes.set(punktId, text);
    } else {
      state.notes.delete(punktId);
    }

    // Kommentar-Dot updaten
    updateCommentDot(punktId);

    // Gespeichert-Anzeige
    document.getElementById('sheet-saved').classList.remove('visible');

    // Debounce Supabase-Aufruf
    if (token) {
      clearTimeout(state._noteTimers.get(punktId));
      state._noteTimers.set(punktId, setTimeout(function() {
        sb.rpc('update_kommentar', {
          p_token: token,
          p_punkt_id: punktId,
          p_kommentar: text
        }).then(function() {
          // Nur anzeigen wenn Sheet noch offen
          if (currentCommentPunktId === punktId) {
            document.getElementById('sheet-saved').classList.add('visible');
            setTimeout(function() {
              document.getElementById('sheet-saved').classList.remove('visible');
            }, 2000);
          }
        });
      }, 500));
    }
  });
}

function updateCommentDot(punktId) {
  var btn = document.querySelector('[data-comment="' + punktId + '"]');
  if (!btn) return;
  var hasNote = state.notes.has(punktId) && state.notes.get(punktId).length > 0;
  btn.classList.toggle('has-comment', hasNote);
}

/* ============================================================
   TEILEN
   ============================================================ */
function shareLink() {
  var url = location.origin + '/swipe.html?t=' + encodeURIComponent(token);
  if (navigator.share) {
    navigator.share({
      title: 'Bad-Inspiration — Jäggi Vollmer',
      url: url
    }).catch(function() { /* Abgebrochen */ });
  } else {
    // Fallback: Zwischenablage
    navigator.clipboard.writeText(url).then(function() {
      showToast('Link kopiert');
    }).catch(function() {
      showToast('Link konnte nicht kopiert werden');
    });
  }
}

/* ============================================================
   EXPAND / COLLAPSE DETAILS
   ============================================================ */
function setupContentToggle() {
  document.addEventListener('click', function(e) {
    var content = e.target.closest('.swipe-card__content');
    if (!content) return;
    // Nicht wenn auf Action-Button geklickt
    if (e.target.closest('.action-btn')) return;
    content.classList.toggle('expanded');
  });
}

/* ============================================================
   SCROLL-POSITION TRACKING + PARALLAX
   ============================================================ */
function setupScrollTracking() {
  var container = document.getElementById('swipe-container');
  var cards = container.querySelectorAll('.swipe-card');
  var cardHeight = window.innerHeight;

  // IntersectionObserver fuer aktive Karte
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
        state.currentIndex = parseInt(entry.target.dataset.index, 10);
        updatePosition();
      }
    });
  }, {
    root: container,
    threshold: [0.5]
  });

  cards.forEach(function(card) { observer.observe(card); });

  // Parallax-Effekt auf Hintergrundbilder
  var ticking = false;
  container.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(function() {
        var scrollTop = container.scrollTop;
        var vh = window.innerHeight;
        cards.forEach(function(card) {
          var bg = card.querySelector('.swipe-card__bg');
          if (!bg) return;
          var cardTop = card.offsetTop;
          var offset = (scrollTop - cardTop) / vh;
          // Leichter Parallax: Bild bewegt sich langsamer
          var translateY = offset * 30;
          bg.style.transform = 'translateY(' + translateY + 'px) scale(1.08)';
        });
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
}

/* ============================================================
   VIDEO AUTOPLAY / PAUSE (IntersectionObserver)
   ============================================================ */
function setupVideoObserver() {
  var container = document.getElementById('swipe-container');
  var videos = container.querySelectorAll('.swipe-card__bg video');
  if (videos.length === 0) return;

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      var video = entry.target;
      if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
        video.play().catch(function() { /* Autoplay blockiert */ });
      } else {
        video.pause();
      }
    });
  }, {
    root: container,
    threshold: [0.5]
  });

  videos.forEach(function(v) { observer.observe(v); });
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
function setupEvents() {
  document.addEventListener('click', function(e) {
    // Herz-Button
    var heart = e.target.closest('[data-heart]');
    if (heart) {
      toggleLike(heart.dataset.heart, false);
      return;
    }

    // Kommentar-Button
    var comment = e.target.closest('[data-comment]');
    if (comment) {
      openCommentSheet(comment.dataset.comment);
      return;
    }

    // Teilen-Button
    var share = e.target.closest('[data-share]');
    if (share) {
      shareLink();
      return;
    }
  });
}

/* ============================================================
   FEHLERANZEIGE
   ============================================================ */
function showError(type) {
  document.getElementById('loading').style.display = 'none';
  var html = '';
  if (type === 'no-token') {
    html = '<div class="error-screen"><div class="error-screen__inner">' +
      '<h2>Link unvollständig</h2>' +
      '<p>Dieser Link scheint unvollständig zu sein.<br>Bitte kontaktieren Sie Jäggi Vollmer.<br><br><a href="tel:+41616920311">+41 61 692 03 11</a></p>' +
    '</div></div>';
  } else if (type === 'invalid') {
    html = '<div class="error-screen"><div class="error-screen__inner">' +
      '<h2>Link nicht mehr aktiv</h2>' +
      '<p>Dieser Link ist nicht mehr aktiv oder existiert nicht.<br>Bei Fragen kontaktieren Sie uns gerne.<br><br><strong>Jäggi Vollmer</strong><br><a href="tel:+41616920311">+41 61 692 03 11</a></p>' +
    '</div></div>';
  } else {
    html = '<div class="error-screen"><div class="error-screen__inner">' +
      '<h2>Verbindungsfehler</h2>' +
      '<p>Die Seite konnte nicht geladen werden.<br>Bitte versuchen Sie es erneut.</p>' +
      '<button class="error-screen__retry" onclick="location.reload()">Erneut versuchen</button>' +
    '</div></div>';
  }
  document.body.innerHTML = html;
}

/* ============================================================
   BOOT
   ============================================================ */
document.addEventListener('DOMContentLoaded', async function() {
  if (!token) {
    showError('no-token');
    return;
  }

  try {
    var res = await sb.rpc('get_inspiration_data', { p_token: token });
    if (res.error) throw res.error;
    var data = res.data;

    // Kundendaten
    state.kunde = data.kunde;

    // Kategorien-Meta
    (data.kategorien || []).forEach(function(k) {
      state.kategorien[k.id] = { titel: k.titel, intro: k.intro || '' };
    });

    // Punkte (nach Kategorie-Reihenfolge und Reihenfolge sortiert)
    var punkte = data.punkte || [];
    // Kategorie-Reihenfolge aus DB
    var catOrder = (data.kategorien || []).map(function(k) { return k.id; });
    punkte.sort(function(a, b) {
      var aCatIdx = catOrder.indexOf(a.kategorie);
      var bCatIdx = catOrder.indexOf(b.kategorie);
      if (aCatIdx === -1) aCatIdx = 999;
      if (bCatIdx === -1) bCatIdx = 999;
      if (aCatIdx !== bCatIdx) return aCatIdx - bCatIdx;
      return (a.reihenfolge || 0) - (b.reihenfolge || 0);
    });
    state.punkte = punkte;

    // Bestehende Interessen laden
    (data.interessen || []).forEach(function(i) {
      if (i.interessiert) state.liked.set(i.punkt_id, true);
      if (i.kommentar) state.notes.set(i.punkt_id, i.kommentar);
    });

    // Rendern
    renderCards();

    // Loading ausblenden, Container anzeigen
    document.getElementById('loading').style.display = 'none';
    var container = document.getElementById('swipe-container');
    container.style.display = 'block';
    document.getElementById('position').style.display = 'block';

    // Setup
    updatePosition();
    setupScrollTracking();
    setupVideoObserver();
    setupDoubleTap();
    setupCommentSheet();
    setupContentToggle();
    setupEvents();

  } catch (e) {
    console.error('Fehler beim Laden:', e);
    showError('invalid');
  }
});
</script>
