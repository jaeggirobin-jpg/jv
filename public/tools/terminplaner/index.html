<!doctype html><html><head><meta name="robots" content="noindex, nofollow"><script src="/tools/assets/jv-bridge.js" data-tool="terminplaner"></script><script src="/tools/assets/geo-admin.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bau-Terminplaner JV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky top bar with tabs; working surface below. Terminplan = sticky table on the left, scrolling Gantt on the right. */
:root{
  --bg:#F1F2F3; --surface:#FFFFFF; --surface-2:#F7F7F8; --line:#DFE1E4; --line-2:#ECEDEF;
  --fg:#1D2024; --muted:#697079; --accent:#AF7631; --accent-2:#8F5E22; --accent-soft:#F4E7D5; --on-accent:#FFFFFF;
  --slate:#5A6C80; --slate-soft:#E3E8EE; --ok:#3B8656; --ok-soft:#E1F0E6; --warn:#B9810F; --warn-soft:#FBF0D6;
  --late:#C4423A; --late-soft:#F8E1DF; --hol:rgba(175,118,49,.10); --grid:rgba(29,32,36,.06); --grid-w:rgba(29,32,36,.16);
  --logo-bg:#FFFFFF; --shadow:0 8px 30px rgba(20,24,28,.16);
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --surface:#1C1F23; --surface-2:#22262B; --line:#33383F; --line-2:#2A2E34;
  --fg:#E7E8EA; --muted:#9BA1A9; --accent:#D39A55; --accent-2:#E5B378; --accent-soft:#3A2D1D; --on-accent:#1A1309;
  --slate:#7E93AA; --slate-soft:#2A323C; --ok:#5DB27F; --ok-soft:#1E3326; --warn:#DDA73A; --warn-soft:#3A2F17;
  --late:#E6675D; --late-soft:#3C1F1D; --hol:rgba(211,154,85,.12); --grid:rgba(255,255,255,.05); --grid-w:rgba(255,255,255,.14);
  --logo-bg:#F4F4F4; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --surface:#1C1F23; --surface-2:#22262B; --line:#33383F; --line-2:#2A2E34;
  --fg:#E7E8EA; --muted:#9BA1A9; --accent:#D39A55; --accent-2:#E5B378; --accent-soft:#3A2D1D; --on-accent:#1A1309;
  --slate:#7E93AA; --slate-soft:#2A323C; --ok:#5DB27F; --ok-soft:#1E3326; --warn:#DDA73A; --warn-soft:#3A2F17;
  --late:#E6675D; --late-soft:#3C1F1D; --hol:rgba(211,154,85,.12); --grid:rgba(255,255,255,.05); --grid-w:rgba(255,255,255,.14);
  --logo-bg:#F4F4F4; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:30px;width:auto;background:var(--logo-bg);border-radius:4px;padding:3px 5px}
.brand b{font-weight:800;letter-spacing:.01em;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.projpick{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 260px}
.projpick select{min-width:0;flex:1;max-width:340px;font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:0 1 auto;max-width:100%}
.tab{border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-2)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--accent)}
.savestate{font-size:12px;color:var(--muted);white-space:nowrap}
.savestate.err{color:var(--late)}

main{padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 11px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--late)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea.inp{resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--accent);outline:none}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.card-h h2{font-size:15px;font-weight:700}
.card-b{padding:14px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* project header (mirrors the Excel title block) */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px}
.ph-title{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;padding:14px;border-bottom:1px solid var(--line-2)}
.ph-title input.big{font-size:22px;font-weight:800;border:1px solid transparent;background:none;padding:2px 6px;margin-left:-6px;border-radius:6px;min-width:0;flex:1 1 260px}
.ph-title input.big:hover{border-color:var(--line)}
.ph-title input.big:focus{border-color:var(--accent);outline:none}
.ph-title input.big{flex:0 1 auto;field-sizing:content;min-width:120px;max-width:100%}
.ph-title .rn-btn{flex:none;width:auto;padding:0 10px;gap:5px;font-size:12px;color:var(--muted);margin-right:auto}.ph-title .rn-btn:hover{color:var(--fg)}
.kpis{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;font-weight:600;white-space:nowrap}
.pill b{font-family:var(--f-mono);font-weight:500}
.pill.late{background:var(--late-soft);border-color:transparent;color:var(--late)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.acc{background:var(--accent-soft);border-color:transparent}
.collapse-btn{margin-left:auto}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:9px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* Gantt */
.g-scroll{overflow:auto;max-height:calc(100vh - 210px);min-height:260px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative}
.g-inner{position:relative;min-width:100%}
.g-row{display:flex;height:34px;position:relative}
.g-l{position:sticky;left:0;z-index:3;flex:none;width:var(--lw);display:grid;grid-template-columns:var(--cols);align-items:center;gap:0 4px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line-2);padding:0 6px 0 4px}
.g-tl{position:relative;flex:none;border-bottom:1px solid var(--line-2)}
.g-head{position:sticky;top:0;z-index:6;height:auto}
.g-head .g-l{z-index:7;background:var(--surface-2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);height:auto;align-items:end;padding-bottom:6px;border-bottom:1px solid var(--line)}
.g-head .g-tl{background:var(--surface-2);border-bottom:1px solid var(--line)}
.kw-row,.day-row{display:flex}
.kw-row div{flex:none;box-sizing:border-box;font-size:11px;font-weight:700;padding:5px 4px 3px;border-left:1px solid var(--grid-w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw-row div span{font-weight:500;color:var(--muted)}
.day-row div{flex:none;text-align:center;font-size:10px;line-height:1.15;padding:2px 0 4px;color:var(--muted);font-family:var(--f-mono)}
.day-row div b{display:block;color:var(--fg);font-weight:500;font-size:11px}
.day-row div.hol{color:var(--accent)}
.day-row div.td{background:var(--late);color:#fff;border-radius:4px}
.day-row div.td b{color:#fff}
.g-ov{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none}
.g-ov .hcol{position:absolute;top:0;bottom:0;background:var(--hol)}
.g-ov .wecol{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--grid-w) 0 1px,transparent 1px 5px),var(--grid)}
.g-ov .wl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid-w)}
.g-ov .dl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.day-row div.we{background:repeating-linear-gradient(135deg,var(--grid-w) 0 1px,transparent 1px 5px);align-self:stretch}
.bar-gap{position:absolute;top:16px;height:0;border-top:2px dotted var(--muted);opacity:.55;pointer-events:none}
.g-ov .today{position:absolute;top:0;bottom:0;width:2px;background:var(--late);opacity:.8}
.g-rows{position:relative;z-index:1}
.g-row.task:hover .g-l,.g-row.task:hover .g-tl{background-color:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.g-row.task:hover .g-l{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.g-row.phase .g-l{background:var(--surface-2);font-weight:700}
.g-row.phase .g-tl{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.g-row.addrow .g-l{background:var(--surface)}
.g-l .cell{min-width:0;display:flex;align-items:center;gap:5px}
.g-l input.ci{border:1px solid transparent;background:none;border-radius:4px;padding:4px 5px;width:100%;min-width:0}
.g-l input.ci:hover{border-color:var(--line)}
.g-l input.ci:focus{border-color:var(--accent);background:var(--surface);outline:none}
.g-l input.ci.num{text-align:right;padding-right:3px}
.g-l input[type=date].ci{font-family:var(--f-mono);font-size:12px;padding:3px 2px}
.g-l .end{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ord{display:flex;flex-direction:column;align-items:center}
.ord button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0;line-height:1;font-size:9px;height:13px;width:18px;border-radius:3px}
.ord button:hover{color:var(--fg);background:var(--surface-2)}
.typ{flex:none;font-size:9px;font-weight:800;letter-spacing:.04em;border-radius:3px;padding:2px 4px;line-height:1}
.typ.jv{background:var(--accent);color:var(--on-accent)}
.typ.u{background:var(--slate);color:#fff}
.typ.x{background:var(--line);color:var(--muted)}
.chain{color:var(--muted);flex:none;width:12px;text-align:center;font-size:12px;cursor:help}
.g-l select.ci{border:1px solid transparent;background:none;border-radius:4px;padding:4px 2px;width:100%;min-width:0;font-size:12.5px;cursor:pointer;text-overflow:ellipsis}
.g-l select.ci:hover{border-color:var(--line);background:var(--surface)}
.g-l select.ci:focus{border-color:var(--accent);background:var(--surface);outline:none}
.g-l select.firmsel.none{color:var(--muted);font-style:italic}
.g-l select.ci:disabled{cursor:default;opacity:1;color:var(--fg)}
.g-l select.ci:disabled:hover{border-color:transparent;background:none}
.firmbtn{border:1px dashed transparent;background:none;cursor:pointer;text-align:left;padding:4px 5px;border-radius:4px;width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.firmbtn:hover{border-color:var(--line)}
.firmbtn.none{color:var(--muted);font-style:italic}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.todo{background:var(--line);box-shadow:inset 0 0 0 1px var(--muted)}
.dot.wip{background:var(--warn)}
.dot.done{background:var(--ok)}
.dot.late{background:var(--late)}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:4px;display:inline-flex}
.iconbtn:hover{color:var(--fg);background:var(--surface-2)}
.phname{font-weight:700;font-size:13.5px}
.caret{border:0;background:none;cursor:pointer;color:var(--muted);width:20px;padding:0;font-size:11px;transition:transform .15s}
.caret.closed{transform:rotate(-90deg)}

.bar{position:absolute;top:7px;height:20px;border-radius:4px;background:var(--slate);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;overflow:hidden;cursor:grab;touch-action:none;user-select:none;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bar.jv{background:var(--accent);color:var(--on-accent)}
.bar.done{background:var(--ok);color:#fff}
.bar.late{box-shadow:0 0 0 2px var(--late)}
.bar i{position:absolute;inset:0 auto 0 0;background:rgba(0,0,0,.22);pointer-events:none}
.bar span{position:relative;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar b.h{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize}
.bar b.hl{position:absolute;left:0;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:1}
.bar:hover b.h,.bar:hover b.hl{background:rgba(255,255,255,.28)}
.bar.dragging{opacity:.85;cursor:grabbing;z-index:5}
.bar-out{position:absolute;top:9px;font-size:11px;color:var(--muted);white-space:nowrap;pointer-events:none}
.ms{position:absolute;top:9px;width:16px;height:16px;transform:rotate(45deg);background:var(--fg);border-radius:2px;cursor:pointer}
.ms.jv{background:var(--accent)}
.phbar{position:absolute;top:14px;height:6px;border-radius:3px;background:var(--fg);opacity:.35}
.addrow .g-l{grid-template-columns:1fr}
.quickadd{display:flex;gap:6px;align-items:center;padding-left:24px}
.quickadd select{max-width:220px;font-size:12.5px;padding:4px 6px}

.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-size:20px}
.empty p{max-width:52ch;color:var(--muted);margin:0}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.act{white-space:nowrap;text-align:right;width:1%}
.tbl .strong{font-weight:700}
.copyable{user-select:all}

/* Firmen */
.fgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
.cnt{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:500}
.cnt.low{background:var(--warn-soft);color:var(--warn)}
.cnt.zero{background:var(--late-soft);color:var(--late)}
.firm-li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.firm-li:last-child{border-bottom:0}
.firm-li .nm{font-weight:700}
.firm-li .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.firm-li .meta span{white-space:nowrap}
.own{font-size:10px;font-weight:800;background:var(--accent);color:var(--on-accent);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:2px}

/* Offerten */
.of-layout{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.of-layout{grid-template-columns:minmax(0,1fr)}}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgs figure{margin:0;position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--surface-2);max-width:100%}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.imgs figure button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--fg)}
.drop input{display:none}
.of-task{border-bottom:1px solid var(--line)}
.of-task:last-child{border-bottom:0}
.of-th{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 14px;background:var(--surface-2)}
.of-th .nm{font-weight:700}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--slate-soft);color:var(--fg);white-space:nowrap}
.bid{display:grid;grid-template-columns:24px minmax(140px,1.4fr) minmax(130px,1fr) 128px 112px 30px;gap:6px 10px;align-items:center;padding:7px 14px;border-top:1px solid var(--line-2)}
.bid .fn{font-weight:600;min-width:0}
.bid .fn small{display:block;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bid select,.bid input{font-size:12.5px;padding:5px 6px}
.bid.best .amt{border-color:var(--ok);background:var(--ok-soft)}
.st-angefragt{color:var(--warn)} .st-erhalten{color:var(--ok)} .st-vergeben{color:var(--accent)} .st-abgesagt{color:var(--muted)}
@media (max-width:720px){.bid{grid-template-columns:24px 1fr 30px}.bid .c3,.bid .c4,.bid .c5{grid-column:2/3}}
.of-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px 12px 48px}
.hint{font-size:12px;color:var(--warn);display:inline-flex;align-items:center;gap:5px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06)}

/* ===== Design 2: refined surfaces, soft depth, Manrope ===== */
:root{--f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#F2F3F5;--surface:#FFFFFF;--surface-2:#F7F8FA;--line:#E3E6EA;--line-2:#ECEEF1;--fg:#15181C;--muted:#6A717B;
  --accent:#AE7432;--accent-2:#8A5A1F;--accent-hi:#C68B45;--accent-soft:#F5EADB;--slate:#5B6F84;--slate-hi:#7489A0;--ok-hi:#52A06E;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--shadow-md:0 8px 24px rgba(16,24,40,.08);--radius:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111316;--surface:#191C20;--surface-2:#1F2328;--line:#2E3339;--line-2:#262A30;--fg:#ECEDEF;--muted:#9AA1AA;
  --accent:#D29A55;--accent-2:#E8B97F;--accent-hi:#E2AE6E;--accent-soft:#33281B;--slate:#6F8399;--slate-hi:#8EA2B8;--ok-hi:#6CC08D;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);--shadow-md:0 8px 28px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#111316;--surface:#191C20;--surface-2:#1F2328;--line:#2E3339;--line-2:#262A30;--fg:#ECEDEF;--muted:#9AA1AA;
  --accent:#D29A55;--accent-2:#E8B97F;--accent-hi:#E2AE6E;--accent-soft:#33281B;--slate:#6F8399;--slate-hi:#8EA2B8;--ok-hi:#6CC08D;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);--shadow-md:0 8px 28px rgba(0,0,0,.45)}
body{letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
.top{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line-2)}
.top-in{padding-block:12px;gap:12px 20px}
.brand{gap:14px}
.brand img{height:34px;border-radius:8px;padding:3px 6px}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand small{font-size:10px;letter-spacing:.14em;font-weight:600}
.tabs{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:4px;gap:2px}
.tab{border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px;transition:background .15s,color .15s}
.tab:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:var(--fg)}
main{gap:18px;padding-block:22px 120px}
/* object map backdrop: grey cadastral map behind the working surface, object pinned bottom-centre */
#objbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#objbg .ob-map{position:absolute;inset:0;background-repeat:no-repeat;background-size:cover;background-position:50% 82%;opacity:.55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #objbg .ob-map{filter:invert(1) brightness(.9);opacity:.22}}
:root[data-theme="dark"] #objbg .ob-map{filter:invert(1) brightness(.9);opacity:.22}
#objbg .ob-pin{position:absolute;left:50%;top:82%;display:flex;align-items:center;gap:6px;transform:translate(-9px,-100%)}
#objbg .ob-pin svg{width:18px;height:26px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
#objbg .ob-lbl{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;line-height:1.25;box-shadow:var(--shadow-sm,0 1px 3px rgba(0,0,0,.12));margin-bottom:12px;white-space:nowrap}
#objbg .ob-lbl b{display:block;font-weight:700}
#objbg .ob-lbl span{color:var(--muted);font-size:11px}
.top{z-index:20}
main{position:relative;z-index:1}
.card{border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-h{padding:16px 18px;border-bottom-color:var(--line-2)}
.card-h h2{font-size:15.5px;font-weight:800;letter-spacing:-.012em}
.card-b{padding:18px}
.btn{border-radius:10px;padding:8px 14px;font-weight:600;border-color:var(--line);box-shadow:var(--shadow-sm);transition:border-color .15s,transform .15s,box-shadow .15s,background .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn.pri{background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.pri:hover{filter:brightness(1.04)}
.btn.ghost{box-shadow:none}
.btn.ghost:hover{transform:none;box-shadow:none}
.btn.sm{border-radius:8px;padding:5px 10px}
.inp,select.inp,textarea.inp{border-radius:10px;padding:8px 11px;border-color:var(--line);transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f>span,.eyebrow{font-size:10.5px;letter-spacing:.09em;font-weight:700}
.seg{border-radius:10px;border-color:var(--line);background:var(--surface-2);padding:3px;gap:2px}
.seg button{border-radius:7px;background:transparent;padding:5px 11px}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.ph-title{padding:20px 20px 16px;gap:12px 20px}
.ph-title input.big{font-size:28px;font-weight:800;letter-spacing:-.025em}
.pill{padding:5px 11px;border-radius:999px;background:var(--surface-2);border-color:var(--line-2);font-weight:600}
.pill.acc{background:var(--accent-soft)}
.planrow{background:linear-gradient(180deg,var(--surface-2),var(--surface));border-bottom-color:var(--line-2)}
.legend{gap:16px}
.legend i{border-radius:3px}
.g-scroll{border-radius:var(--radius);border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.g-row{height:38px}
.g-l{border-bottom-color:var(--line-2);border-right-color:var(--line-2);padding:0 8px 0 6px}
.g-tl{border-bottom-color:var(--line-2)}
.g-head .g-l,.g-head .g-tl{background:var(--surface)}
.g-head .g-l{font-size:10.5px;letter-spacing:.09em}
.kw-row div{font-weight:800;letter-spacing:-.005em}
.g-row.phase .g-l{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.phname{font-weight:800!important;letter-spacing:-.01em}
.bar{top:9px;height:20px;border-radius:6px;background:linear-gradient(180deg,var(--slate-hi),var(--slate));box-shadow:0 1px 2px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.18)}
.bar.jv{background:linear-gradient(180deg,var(--accent-hi),var(--accent))}
.bar.done{background:linear-gradient(180deg,var(--ok-hi),var(--ok))}
.bar.late{box-shadow:0 0 0 2px var(--late),0 1px 2px rgba(0,0,0,.14)}
.bar i{background:rgba(0,0,0,.18)}
.bar span{font-weight:700;letter-spacing:.005em}
.bar-out{top:11px}

.phbar{top:16px;height:6px;border-radius:999px;opacity:.28}
.bar-gap{top:19px}
.ghost{top:8px;border-radius:6px}
.typ{border-radius:4px;padding:2px 5px}
.day-row div.td{border-radius:6px}
.firm-li{padding:12px 18px}
.cnt{font-weight:600}
.of-th{padding:12px 18px}
.bid{padding:9px 18px}
.actionbar{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top-color:var(--line-2)}
.modal-bg{background:rgba(12,14,18,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.modal-h{padding:18px 20px}
.modal-b{padding:20px}
.modal-f{padding:14px 20px}
.toast{border-radius:12px;padding:11px 18px}

/* ===== Design 3: dark JV navigation, KPI tiles, evaluation ===== */
:root{--nav-bg:#1B2027;--nav-2:#272E37;--nav-line:#353D47;--nav-fg:#F1F3F5;--nav-muted:#9EA7B2}
body{background:radial-gradient(1100px 420px at 0% 0%,color-mix(in srgb,var(--accent-soft) 70%,transparent),transparent 65%),var(--bg);background-attachment:fixed}
body::before{background:var(--nav-bg)}
.top{background:var(--nav-bg);border-bottom:0;box-shadow:0 6px 24px rgba(10,14,20,.18);-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--nav-fg)}
.brand img{background:#fff;padding:5px 9px;border-radius:9px;height:38px}
.brand b{color:var(--nav-fg);font-size:17px}
.brand small{color:var(--accent-hi)}
.top .inp{background:var(--nav-2);color:var(--nav-fg);border-color:var(--nav-line)}
.top .inp option{color:#15181C;background:#fff}
.top .btn{background:var(--nav-2);color:var(--nav-fg);border-color:var(--nav-line);box-shadow:none}
.top .btn:hover{border-color:var(--accent-hi);box-shadow:none}
.top .btn.pri{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:#fff;border-color:transparent}
.tabs{background:transparent;border:0;padding:0;gap:4px}
.tab{color:var(--nav-muted);border-radius:9px;padding:8px 14px}
.tab:hover{background:var(--nav-2);color:var(--nav-fg)}
.tab[aria-selected="true"],:root[data-theme="dark"] .tab[aria-selected="true"]{background:var(--nav-2);color:#fff;box-shadow:inset 0 -2px 0 var(--accent-hi)}
.savestate{color:var(--nav-muted)}
.savestate.err{color:#FF8A80}
/* project hero */
.ph-title{padding:24px 24px 18px;align-items:center}
.ph-title input.big{font-size:30px}
.kpis{gap:8px}
.kpis .pill{flex-direction:column;align-items:flex-start;gap:2px;border-radius:12px;padding:8px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);min-width:92px}
.kpis .pill b{font-size:15px;color:var(--fg);text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-weight:500}
.kpis .pill.acc{background:var(--accent-soft);border-color:transparent}
.kpis .pill.ok{color:var(--ok)} .kpis .pill.ok b{color:var(--ok)}
.kpis .pill.late{color:var(--late)}
.kpis .pill.warn{color:var(--warn)}
.card{background:color-mix(in srgb,var(--surface) 94%,transparent)}
.flag{flex:none;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--late);background:var(--late-soft);border-radius:4px;padding:1px 4px;cursor:help}
/* evaluation */
.adj{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:1px}
.adj .iconbtn{width:24px;height:24px;justify-content:center;border-radius:999px;font-weight:700;padding:0}
.adj b{min-width:30px;text-align:center;font-size:12.5px;font-weight:600}
.adj b.late{color:var(--late)}.adj b.ok{color:var(--ok)}
.twrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.twrow .chk{min-width:96px}
.twrow input[type=time]{width:132px;flex:none}
.twchip{flex:none;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--slate);background:var(--slate-soft);border-radius:4px;padding:1px 5px;white-space:nowrap}
.kpis-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;padding:18px}
.kpi{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-size:20px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:12px}
.kpi.late{background:var(--late-soft);border-color:transparent}.kpi.late b{color:var(--late)}
.kpi.ok{background:var(--ok-soft);border-color:transparent}.kpi.ok b{color:var(--ok)}
.evalgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.hb-l{font-size:13px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.hb-t{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-hi),var(--accent))}
.hb b{font-size:12.5px;font-weight:500}
.warnchip{background:var(--late-soft);color:var(--late)}
.tbl td.late{color:var(--late)} .tbl td.ok{color:var(--ok)}

/* ===== Design 4: Inter, trade colours, firm logos ===== */
:root{--f-ui:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--f-mono:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,sans-serif}
body{font-feature-settings:"cv11" 1,"ss01" 1;letter-spacing:-.011em}
.mono,.num,.g-l input[type=date].ci,.g-l .end,.pill b,.kpis .pill b,.day-row div{font-variant-numeric:tabular-nums;letter-spacing:-.005em}
h1,h2,h3,.ph-title input.big,.brand b,.kpi b{letter-spacing:-.022em}
.ph-title input.big{font-weight:700}
.card-h h2{font-weight:700}
.bar{border-radius:7px;box-shadow:0 1px 1.5px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.25)}
.bar.done{opacity:.55}
.bar span{font-weight:600}
.ms{box-shadow:0 1px 2px rgba(0,0,0,.2)}
.twb{font-weight:800;background:rgba(0,0,0,.18);border-radius:4px;padding:0 4px;margin-right:2px}
.bar-out .twb{background:var(--accent-soft);color:var(--accent-2)}
.twchip{font-family:var(--f-ui);font-weight:800;font-size:10.5px;color:var(--accent-2);background:var(--accent-soft);padding:2px 6px;border-radius:5px}
:root[data-theme="dark"] .twchip{color:var(--accent)}
.fdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
#fm-color{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface);cursor:pointer}
.g-l input.ci.auto{color:var(--muted);font-style:italic}
.tav{flex:none;width:30px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;letter-spacing:.02em;overflow:hidden}
.tav.logo{background:#fff;border:1px solid var(--line-2);padding:1px}
.tav.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.tav.none{border:1.5px dashed var(--line);background:transparent}
.legend i{width:12px;height:12px;border-radius:4px}

/* ===== Basel map background ===== */
.top-in{position:relative;z-index:1}
.ph-title{position:relative;overflow:hidden;border-radius:var(--radius) var(--radius) 0 0}
.ph-title>*{position:relative;z-index:1}
.kpis .pill{background:color-mix(in srgb,var(--surface-2) 88%,transparent);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.kpis .pill.prog{background:linear-gradient(90deg,var(--accent-soft) var(--pg),color-mix(in srgb,var(--surface-2) 88%,transparent) var(--pg))}

.card{background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

/* ===== Terminplan: Karte durchscheinen lassen ===== */
#gscroll{background:color-mix(in srgb,var(--surface) 86%,transparent)}
#gscroll .g-l{background:color-mix(in srgb,var(--surface) 96%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#gscroll .g-row.phase .g-l{background:var(--surface-2)}
#gscroll .g-row.phase .g-tl{background:color-mix(in srgb,var(--surface-2) 75%,transparent)}
#gscroll .g-head .g-l,#gscroll .g-head .g-tl{background:var(--surface);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#gscroll .g-tl{background:transparent}
#gscroll .g-row.task:hover .g-tl{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
#gscroll .g-ov .wecol{background:repeating-linear-gradient(135deg,var(--grid-w) 0 1px,transparent 1px 5px),rgba(255,255,255,.35)}
#gscroll .g-row.addrow .g-l{background:color-mix(in srgb,var(--surface) 70%,transparent)}
/* Lesbarkeit */
#gscroll .g-l{color:var(--fg)}
#gscroll .g-l input.ci,#gscroll .g-l select.ci{color:var(--fg);font-weight:500}
#gscroll .bar{height:24px;top:7px;font-size:12px}
#gscroll .bar.done{opacity:1;filter:saturate(.8)}
#gscroll .bar.done::after{content:"✓";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:inherit;opacity:.9}
#gscroll .bar-out{top:9px;font-size:12px;font-weight:500;color:var(--fg);background:color-mix(in srgb,var(--surface) 92%,transparent);padding:2px 7px;border-radius:6px;box-shadow:0 0 0 1px var(--line-2)}
#gscroll .bar-gap{top:19px}
#gscroll .tdel{opacity:.35;color:var(--muted)}#gscroll .g-row.task:hover .tdel{opacity:.8}#gscroll .tdel:hover{opacity:1;color:var(--late)}
.toast{pointer-events:auto}
</style>

/* ---------- dates (UTC, ISO strings) ---------- */
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const iso=dt=>dt.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);};
const dow=s=>D(s).getUTCDay();
const todayIso=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmt=s=>s?`${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(2,4)}`:'';
const fmtWD=s=>s?`${WD[dow(s)]} ${fmt(s)}`:'';
const fmtLong=s=>s?`${WD[dow(s)]}, ${+s.slice(8,10)}. ${MONL[+s.slice(5,7)-1]} ${s.slice(0,4)}`:'';
function isoWeek(s){const d=D(s);const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day+3);const fy=d.getUTCFullYear();const f=new Date(Date.UTC(fy,0,4));return 1+Math.round(((d-f)/864e5-3+((f.getUTCDay()+6)%7))/7);}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return `${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`;}
const HOLC={};
function holidays(y){if(HOLC[y])return HOLC[y];const e=easter(y);const m=new Map([[`${y}-01-01`,'Neujahr'],[addDays(e,-2),'Karfreitag'],[addDays(e,1),'Ostermontag'],[`${y}-05-01`,'Tag der Arbeit'],[addDays(e,39),'Auffahrt'],[addDays(e,50),'Pfingstmontag'],[`${y}-08-01`,'Bundesfeier'],[`${y}-12-25`,'Weihnachten'],[`${y}-12-26`,'Stephanstag']]);(S.cfg.extraClosed||'').split(/[\s,;]+/).forEach(t=>{const mm=t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(mm){let yy=+mm[3];if(yy<100)yy+=2000;if(yy===y)m.set(`${yy}-${mm[2].padStart(2,'0')}-${mm[1].padStart(2,'0')}`,'Betrieb geschlossen');}});HOLC[y]=m;return m;}
const holName=s=>S.cfg.holidays===false?null:(holidays(+s.slice(0,4)).get(s)||null);
const isWork=s=>{const w=dow(s);return w>0&&w<6&&!holName(s);};
function nextWork(s){let i=0;while(!isWork(s)&&i++<30)s=addDays(s,1);return s;}
function prevWork(s){let i=0;while(!isWork(s)&&i++<30)s=addDays(s,-1);return s;}
function addWork(s,n){s=nextWork(s);const st=n>=0?1:-1;let k=0;while(n!==0&&k++<5000){s=addDays(s,st);if(isWork(s))n-=st;}return s;}
function workBetween(a,b){if(a===b)return 0;const st=a<b?1:-1;let n=0,s=a,k=0;while(s!==b&&k++<5000){s=addDays(s,st);if(isWork(s))n+=st;}return n;}
function nextMonday(){let s=todayIso();do{s=addDays(s,1);}while(dow(s)!==1);return s;}

/* ---------- scheduling ---------- */
const linkOf=(t,i)=>i===0?'fix':(t.link||(t.afterPrev?'end':'fix'));
function pass(p){
 if(!p.start)p.start=nextMonday();
 let prev=null,minS=null,maxE=null;
 allTasks(p).forEach((t,i)=>{
  t.dur=Math.max(0,Math.round(+t.dur||0));const lag=Math.round(+t.lag||0);const L=linkOf(t,i);
  if(L==='end'&&prev)t.start=addWork(prev.end,1+lag);
  else if(L==='start'&&prev)t.start=addWork(prev.start,lag);
  else t.start=nextWork(t.start||p.start);
  t.end=t.dur<=1?t.start:addWork(t.start,t.dur-1);
  prev=t;
  if(!minS||t.start<minS)minS=t.start;if(!maxE||t.end>maxE)maxE=t.end;
 });
 p.first=minS||p.start;p.end=maxE||p.start;
}
/* convert old fixed dates into a chain (keeps today's dates, so later changes push everything after) */
function migrateChain(p){
 if(p.chain2)return;pass(p);let prev=null;
 allTasks(p).forEach((t,i)=>{if(i>0&&!t.afterPrev&&prev){t.lag=workBetween(prev.end,t.start)-1;}if(i>0){t.link='end';t.afterPrev=true;}prev=t;});
 p.chain2=true;
}
function withFollow(p,t,fn){const ts=allTasks(p);const i=ts.indexOf(t);const nx=ts[i+1];const keep=nx?nx.start:null;fn();if(!S.pushFollow&&nx&&linkOf(nx,i+1)!=='fix'){pass(p);setStart(p,nx,keep);}}
function setStart(p,t,ns){
 ns=nextWork(ns);const ts=allTasks(p);const i=ts.indexOf(t);const L=linkOf(t,i);
 if(i===0){t.start=ns;if((p.planMode||'start')==='start')p.start=ns;return;}
 const prev=ts[i-1];
 if(L==='end')t.lag=workBetween(prev.end,ns)-1;else if(L==='start')t.lag=workBetween(prev.start,ns);else t.start=ns;
}
const ownFirm=()=>firmList().find(f=>f.own);
const isFixedG=g=>!!g&&(S.cfg.fixedOwn||[]).includes(g);
function recalc(p){
 migrateChain(p);pass(p);
 const mode=p.planMode||'start';let target=null;
 if(mode==='end'&&p.targetEnd)target=prevWork(p.targetEnd);
 else if(mode==='move'&&p.moveIn)target=addWork(p.moveIn,-1);
 if(!target||!allTasks(p).length)return;
 const key=mode+':'+target;
 if(p._tgt!==key){ /* target was set or changed by the user: move the whole plan so it ends there */
  const delta=workBetween(p.end,target);if(delta){allTasks(p).forEach((t,i)=>{if(linkOf(t,i)==='fix')t.start=addWork(t.start,delta);});p.start=addWork(p.start,delta);pass(p);}
  p._tgt=key;
 }else if(p.end!==target){ /* a bar was moved by hand: keep the manual change, let the end / move-in date follow */
  if(mode==='end')p.targetEnd=p.end;else p.moveIn=addWork(p.end,1);
  p._tgt=mode+':'+p.end;
  p._tgtMsg=mode==='end'?`Fertigstellung angepasst: ${fmtWD(p.end)}`:`Einzug angepasst: ${fmtWD(p.moveIn)}`;
 }
}
function progOf(p){const ts=allTasks(p).filter(t=>t.dur>0);const tot=ts.reduce((a,t)=>a+t.dur,0);return tot?Math.round(ts.reduce((a,t)=>a+t.dur*Math.min(100,effProg(t)),0)/tot):0;}
const moveInOf=p=>((p.planMode==='move'&&p.moveIn)?p.moveIn:addWork(p.end,1));
function effProg(t){if(t.progSet)return Math.min(100,Math.max(0,Math.round(Number(t.prog)||0)));const td=todayIso();if(!t.start||!t.end)return 0;if(t.end<td)return 100;if(t.start>=td)return 0;if(!t.dur)return 100;return Math.min(99,Math.round(workBetween(t.start,td)/t.dur*100));}
function status(t){const td=todayIso();const pr=effProg(t);if(pr>=100)return'done';if(t.end<td)return'late';if(t.start<=td||pr>0)return'wip';return'todo';}
function phaseRange(ph){let a=null,b=null;for(const t of ph.tasks){if(!a||t.start<a)a=t.start;if(!b||t.end>b)b=t.end;}return a?[a,b]:null;}
function buildCols(p){
 let a=p.first||p.start,b=p.end||p.start;const td=todayIso();
 if(td<b&&td>addDays(a,-60)&&td<a)a=td;
 a=addDays(a,-14);while(dow(a)!==1)a=addDays(a,-1);
 let e=addDays(b,56);const minE=addDays(a,7*8);if(e<minE)e=minE;
 const cols=[];for(let s=a;s<=e;s=addDays(s,1))cols.push(s);

function domColor(img){try{const c=document.createElement('canvas');const sc=Math.min(1,120/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*sc));c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*sc));const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);const d=g.getImageData(0,0,c.width,c.height).data;const B={};for(let i=0;i<d.length;i+=4){const r=d[i],gg=d[i+1],b=d[i+2],a=d[i+3];if(a<128)continue;const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);if(mn>230||mx<35)continue;const sat=(mx-mn)/Math.max(mx,1);if(sat<.25)continue;const k=(r>>4)+'_'+(gg>>4)+'_'+(b>>4);const e=B[k]||(B[k]=[0,0,0,0,0]);e[0]+=1+2*sat;e[1]+=r;e[2]+=gg;e[3]+=b;e[4]++;}const best=Object.values(B).sort((a,b)=>b[0]-a[0])[0];if(!best)return '';return '#'+[best[1],best[2],best[3]].map(v=>Math.round(v/best[4]).toString(16).padStart(2,'0')).join('').toUpperCase();}catch(e){return '';}}

 const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...RGB.muted);doc.text(`${S.cfg.sender.company||''} · ${p.name||''}`,M,297-M+4);doc.text(`Seite ${i}/${n}`,PW-M,297-M+4,{align:'right'});}

function applySim(q,sim){
 const d=Math.round(+sim.delta||0);if(!d)return;
 if(!sim.task||sim.task==='__all'){allTasks(q).forEach((t,i)=>{if(linkOf(t,i)==='fix')t.start=addWork(t.start,d);});q.start=addWork(q.start,d);return;}
 const t=allTasks(q).find(x=>x.id===sim.task);if(!t)return;
 if(sim.kind==='dur')withFollow(q,t,()=>{t.dur=Math.max(t.dur===0?0:1,t.dur+d);});
 else withFollow(q,t,()=>setStart(q,t,addWork(t.start,d)));
}
function simulate(p,sim){
 recalc(p);const q=clone(p);const base={};allTasks(q).forEach(t=>base[t.id]={start:t.start,end:t.end});
 const baseEnd=p.end,baseMove=moveInOf(p),target=p.planMode==='end'?p.targetEnd:p.planMode==='move'?p.moveIn:'';
 q.planMode='start';applySim(q,sim);recalc(q);
 const delta={},moved=[];allTasks(q).forEach(t=>{const b=base[t.id];const ds=workBetween(b.start,t.start),de=workBetween(b.end,t.end);const dd=ds||de;if(dd){delta[t.id]=dd;moved.push({t,b,ds,de});}});
 return {q,base,delta,moved,baseEnd,baseMove,target,endDelta:workBetween(baseEnd,q.end)};
}

function renderFirms(){
 const q=S.firmQ.toLowerCase();
 const match=f=>!q||[f.name,f.contact,f.city,f.email,(f.gattungen||[]).join(' ')].join(' ').toLowerCase().includes(q);
 const gs=S.cfg.gattungen.filter(g=>!S.firmG||g===S.firmG);
 const noG=firmList().filter(f=>!(f.gattungen||[]).length&&match(f));
 const used=new Set(cur()?allTasks(cur()).map(t=>t.gattung).filter(Boolean):[]);
 const group=(g,fs,cnt)=>`<section class="card"><div class="card-h"><h2>${esc(g)}</h2>${isFixedG(g)?'<span class="cnt" title="Neue Gewerke dieser Gattung gehen standardmässig an Jäggi Vollmer – änderbar">Standard JV</span>':`<span class="cnt ${cnt===0?'zero':cnt<3?'low':''}" title="${cnt<3?'Mindestens 3 Firmen für Offertvergleich empfohlen':'OK'}">${cnt}${cnt<3?' / 3':''}</span>`}${used.has(g)?'<span class="chip">im Projekt</span>':''}<span class="sp"></span><button class="btn sm" data-act="firmNew" data-g="${esc(g)}">${IC.plus}Firma</button></div>
  ${fs.length?fs.map(f=>`<div class="firm-li"><div>${firmColor(f)?`<span class="fdot" style="background:${firmColor(f)}" title="Farbe im Terminplan"></span>`:''}${f.logo?`<img class="flogo" src="${f.logo}" alt="">`:''}<span class="nm">${esc(f.name)}</span>${f.own?'<span class="own">JV</span>':''}<div class="meta">${f.contact?`<span>${esc(f.contact)}</span>`:''}${f.city?`<span>${esc(f.city)}</span>`:''}${f.phone?`<span class="mono">${esc(f.phone)}</span>`:''}${f.mobile?`<span class="mono">${esc(f.mobile)}</span>`:''}${f.email?`<span>${esc(f.email)}</span>`:'<span style="color:var(--late)">keine E-Mail</span>'}</div></div><div><button class="iconbtn" data-act="firmEdit" data-id="${f.id}" title="Bearbeiten">${IC.edit}</button></div></div>`).join(''):`<div class="card-b muted small">Noch keine Firma erfasst.</div>`}</section>`;
 let html=`<div class="toolbar"><input class="inp" style="max-width:280px" id="firmQ" data-chg="firmQ" placeholder="Firma, Ort, Person suchen…" value="${esc(S.firmQ)}">
  <select class="inp" style="max-width:240px" id="firmG" data-chg="firmG"><option value="">Alle Gattungen</option>${S.cfg.gattungen.map(g=>`<option ${g===S.firmG?'selected':''}>${esc(g)}</option>`).join('')}</select>
  <span class="sp"></span><span class="muted small">${Object.keys(S.firms).length} Firmen · Ziel: mind. 3 pro Gattung</span><button class="btn" data-act="firmBase" title="Die Firmen aus der Excel-Kontaktliste ergänzen, falls sie fehlen">Excel-Basisfirmen ergänzen</button><button class="btn pri" data-act="firmNew">${IC.plus}Neue Firma</button></div>`;
 html+='<div class="fgroups">';
 const sorted=[...gs].sort((a,b)=>(used.has(b)?1:0)-(used.has(a)?1:0));
 for(const g of sorted){const all=firmsOf(g);const fs=all.filter(match);if(q&&!fs.length)continue;html+=group(g,fs,all.length);}
 if(noG.length&&!S.firmG)html+=group('Ohne Gattung',noG,noG.length);
 return html+'</div>';
}

const CKL={kunde:'Checkliste Bauherrschaft',intern:'Interne To-dos'};
function renderChecks(){
 const p=cur();if(!p)return emptyProject();
 if(!p.checks){p.checks=defaultChecks();touch(p);}
 return `<div class="cklayout">${['kunde','intern'].map(l=>ckCard(p,l)).join('')}</div>`;
}
function ckCard(p,l){const it=p.checks[l]||[];const n=it.filter(x=>x.done).length;const pct=it.length?Math.round(n/it.length*100):0;const td=todayIso();
 return `<section class="card"><div class="card-h"><div><h2>${CKL[l]}</h2><div class="muted small">${l==='kunde'?'Mit dem Endkunden zu klären – als PDF zum Ausfüllen':'Eigene Pendenzen zu diesem Projekt'}</div></div><span class="sp"></span><span class="cnt ${pct===100?'':'low'}">${n}/${it.length}</span><button class="btn sm" data-act="ckPdf" data-l="${l}">${IC.dl}PDF</button></div>
 <div class="ckbar"><i style="width:${pct}%"></i></div>
 ${it.length?'':'<div class="card-b muted small">Noch keine Punkte.</div>'}
 ${it.map((x,i)=>`<div class="ck ${x.done?'done':''}">
   <input type="checkbox" id="ck-${x.id}-done" data-ckl="${l}" data-cki="${x.id}" data-ckk="done" ${x.done?'checked':''} aria-label="Erledigt">
   <input class="ci txt" id="ck-${x.id}-text" data-ckl="${l}" data-cki="${x.id}" data-ckk="text" value="${esc(x.text)}" aria-label="Punkt">
   <div class="ops"><button class="iconbtn" data-act="ckMove" data-l="${l}" data-id="${x.id}" data-d="-1" ${i===0?'disabled':''} title="nach oben">▲</button><button class="iconbtn" data-act="ckMove" data-l="${l}" data-id="${x.id}" data-d="1" ${i===it.length-1?'disabled':''} title="nach unten">▼</button><button class="iconbtn" data-act="ckDel" data-l="${l}" data-id="${x.id}" title="Löschen">${IC.x}</button></div>
   <div class="sub"><input class="ci" id="ck-${x.id}-note" data-ckl="${l}" data-cki="${x.id}" data-ckk="note" value="${esc(x.note)}" placeholder="Antwort / Notiz"><input class="ci mono ${x.due&&!x.done&&x.due<td?'overdue':''}" type="date" id="ck-${x.id}-due" data-ckl="${l}" data-cki="${x.id}" data-ckk="due" value="${esc(x.due)}" title="Fällig bis" aria-label="Fällig bis"></div></div>`).join('')}
 <div class="ckadd"><input class="inp" id="ckadd-${l}" data-ckadd="${l}" placeholder="${l==='kunde'?'Neuer Punkt, z.B. Armaturenfarbe definiert?':'Neue Pendenz, z.B. Lieferant Apparate anrufen'}"><button class="btn" data-act="ckAdd" data-l="${l}">${IC.plus}Hinzufügen</button></div>
 <div class="ckfoot"><button class="btn ghost sm" data-act="ckStd" data-l="${l}">Fehlende Standardpunkte ergänzen</button><a href="#" class="small" data-act="tab" data-tab="tpl">Standardliste bearbeiten</a></div></section>`;}
function checksPdf(p,l){
 recalc(p);const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});pdfBg(doc,false,p);const PW=210,M=16;const s=S.cfg.sender;
 try{doc.addImage(LOGO,'PNG',M,M,40,10.45);}catch(e){}
 doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...RGB.fg);doc.text(CKL[l],PW-M,M+5,{align:'right'});
 doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...RGB.muted);
 doc.text([`${p.name||''}${p.address&&p.address!==p.name?', '+p.address:''}`,`Ausführung ${fmt(p.first)} – ${fmt(p.end)}  ·  Einzug ${fmt(moveInOf(p))}  ·  Stand ${fmt(todayIso())}`],PW-M,M+11,{align:'right'});
 let y=M+28;
 for(const x of p.checks[l]||[]){
  doc.setFontSize(10.5);const tl=doc.splitTextToSize(x.text,PW-2*M-30);doc.setFontSize(9.5);const nl=x.note?doc.splitTextToSize(x.note,PW-2*M-10):[];
  const h=tl.length*5+(nl.length?nl.length*4.4+1:(l==='kunde'&&!x.done?7:0))+4;
  if(y+h>297-M-12){doc.addPage();y=M+6;}
  doc.setDrawColor(...RGB.fg);doc.setLineWidth(.3);doc.rect(M,y-3.6,4.2,4.2);
  if(x.done){doc.setLineWidth(.6);doc.line(M+.8,y-1.6,M+1.8,y-.3);doc.line(M+1.8,y-.3,M+3.6,y-3);doc.setLineWidth(.3);}
  doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(...RGB.fg);doc.text(tl,M+8,y);
  if(x.due){doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...RGB.muted);doc.text('bis '+fmt(x.due),PW-M,y,{align:'right'});}
  let yy=y+tl.length*5;
  if(nl.length){doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...RGB.muted);doc.text(nl,M+8,yy-.6);yy+=nl.length*4.4+1;}
  else if(l==='kunde'&&!x.done){doc.setDrawColor(...RGB.line);doc.line(M+8,yy+3,PW-M,yy+3);yy+=7;}
  y=yy+4;
 }
 if(l==='kunde'){if(y+30>297-M){doc.addPage();y=M+10;}y+=10;doc.setDrawColor(...RGB.fg);doc.line(M,y+12,M+70,y+12);doc.line(PW-M-70,y+12,PW-M,y+12);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...RGB.muted);doc.text('Ort, Datum',M,y+16);doc.text('Unterschrift Bauherrschaft',PW-M-70,y+16);}
 const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...RGB.muted);doc.text([s.company,leaderOf(p).name,senderPhone(p)&&'Tel. '+senderPhone(p),leaderOf(p).email].filter(Boolean).join('  ·  '),M,297-M+4);doc.text(`Seite ${i}/${n}`,PW-M,297-M+4,{align:'right'});}
 return doc;
}

function phasesFromTpl(id){const T=tplList().find(x=>x.id===id)||tplList()[0];return T.phases.map(ph=>({id:uid(),name:ph.name,tasks:ph.tasks.map(x=>{const t=mkTask(x.name,x.gattung,x.dur,true);t.lag=+x.lag||0;t.note=x.note||'';if(x.link==='start')t.link='start';if(x.tw)t.tw=clone(x.tw);return t;})}));}

/* ---------- mail building ---------- */
function leaders(){if((!S.cfg.leaders||!S.cfg.leaders.length)&&S.cfg.sender&&S.cfg.sender.name){S.cfg.leaders=[{id:'pl_'+uid(),name:S.cfg.sender.name,title:'Projektleiter',phone:S.cfg.sender.phone||'',mobile:S.cfg.sender.mobile||'',email:S.cfg.sender.email||'',signature:''}];}return S.cfg.leaders||[];}
function myLeaderId(){try{return localStorage.getItem('tp_me')||'';}catch(e){return '';}}
function leaderOf(p){const L=leaders();return L.find(x=>x.id===p?.leader)||L.find(x=>x.name&&x.name===p?.author)||L.find(x=>x.id===myLeaderId())||L[0]||{name:'',title:'',phone:'',mobile:'',email:'',signature:''};}
function autoSig(L){const s=S.cfg.sender;return [L.name,L.title,s.company,s.slogan,[s.street,s.city].filter(Boolean).join(', '),[ (L.phone||s.phone)&&'T '+(L.phone||s.phone),L.mobile&&'M '+L.mobile].filter(Boolean).join('  |  '),[L.email,s.web].filter(Boolean).join('  |  ')].filter(Boolean).join('\n');}
function senderPhone(p){const L=leaderOf(p);const s=S.cfg.sender;return [...new Set([L.phone||s.phone,L.mobile].filter(Boolean))].slice(0,2).join(' oder ');}
function leaderSelect(id,p){const L=leaders();const cur_=leaderOf(p);return `<select class="inp" id="${id}" data-pk="leader">${L.map(x=>`<option value="${x.id}" ${x.id===cur_.id?'selected':''}>${esc(x.name||'(ohne Namen)')}</option>`).join('')}${L.length?'':'<option value="">– in Einstellungen erfassen –</option>'}</select>`;}
function fillHinweis(p){return (S.cfg.hinweis||'').replaceAll('{telefon}',senderPhone(p)||'[Telefon in Einstellungen erfassen]');}
function signature(p){const L=leaderOf(p);return (L.signature&&L.signature.trim())?L.signature.trim():autoSig(L);}
function buildMail(p,t,f){
 const anrede=f.anrede?`Guten Tag ${f.anrede}`:f.contact?`Guten Tag ${f.contact}`:'Sehr geehrte Damen und Herren';
 const termin=(t.dur<=1||t.start===t.end)?`${fmtLong(t.start)} (KW ${isoWeek(t.start)})`:`${fmtLong(t.start)} bis ${fmtLong(t.end)} (ca. ${t.dur} Arbeitstag${t.dur===1?'':'e'}, KW ${isoWeek(t.start)}${isoWeek(t.end)!==isoWeek(t.start)?'–'+isoWeek(t.end):''})`;
 const V={arbeitszeit:twText(t),anrede,projekt:p.name||'',adresse:p.address||'',gewerk:t.gattung||t.name,leistung:t.name+(t.note?` (${t.note})`:''),beschreibung:(p.desc||'').trim()||'Gerne erläutern wir Ihnen das Projekt telefonisch oder vor Ort.',termin:termin+` · Arbeitszeit ${twText(t)}`,frist:p.deadline?fmtLong(p.deadline):'nach Absprache',hinweis:fillHinweis(p),telefon:senderPhone(p),signatur:signature(p),firma:f.name};
 const fill=s=>s.replace(/\{(\w+)\}/g,(m,k)=>k in V?V[k]:m);
 let body=S.cfg.tplBody||DEFAULT_CFG.tplBody;
 if(!body.includes('{hinweis}'))body=body.replace(/(\n\s*Freundliche Grüsse)/,'\n\n{hinweis}$1');
 if(!body.includes('{hinweis}'))body+='\n\n{hinweis}';
 const text=fill(body).replace(/\n{3,}/g,'\n\n').trim();
 const subject=fill(S.cfg.tplSubject||DEFAULT_CFG.tplSubject);
 return {to:f.email,toName:f.contact||f.name,subject,text,html:mailHtml(text,p,t)};
}
function mailHtml(text,p,t){
 const paras=esc(text).split(/\n\n/).map(x=>`<p style="margin:0 0 12px">${x.replace(/\n/g,'<br>')}</p>`).join('');
 const row=(k,v)=>v?`<tr><td style="padding:4px 14px 4px 0;color:#697079;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:4px 0">${esc(v)}</td></tr>`:'';
 return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#1d2024">${paras}
 <table style="border-collapse:collapse;font-size:13px;margin-top:8px;border-top:2px solid #AF7631"><tr><td colspan="2" style="padding:8px 0 4px;font-weight:bold">Eckdaten</td></tr>${row('Projekt',p.name)}${row('Adresse',p.address)}${row('Leistung',t.name)}${row('Termin',`${fmt(t.start)} – ${fmt(t.end)} (${t.dur} AT)`)}${row('Eingabefrist',p.deadline?fmt(p.deadline):'nach Absprache')}</table></div>`;
}
/* ---------- Terminplan als PDF per Mail ---------- */
function planRecipients(p){const out=[];const seen=new Set();const add=(email,name,role)=>{email=(email||'').trim();if(!email||seen.has(email.toLowerCase()))return;seen.add(email.toLowerCase());out.push({email,name,role});};
 (p.contacts||[]).forEach(c=>add(c.email,c.name||c.company,c.role||'Kontakt'));
 allTasks(p).forEach(t=>{const fm=S.firms[t.firm];if(fm&&!fm.own)add(fm.email,fm.name,t.gattung||t.name);});
 return out;}
function planMailText(p){const L=leaderOf(p);const mi=moveInOf(p);
 return `Guten Tag\n\nIm Anhang erhalten Sie den aktuellen Terminplan zum Projekt «${p.name||''}»${p.address?' ('+p.address+')':''}.\n\nStart: ${fmtLong(p.first)} (KW ${isoWeek(p.first)})\nBauende: ${fmtLong(p.end)} (KW ${isoWeek(p.end)})${mi?`\nEinzug / Übergabe: ${fmtLong(mi)}`:''}\n\nBitte prüfen Sie Ihre Einsätze und melden Sie sich bei Fragen oder Terminkonflikten direkt bei mir${senderPhone(p)?' unter '+senderPhone(p):''}.\n\nFreundliche Grüsse\n\n${signature(p)}`;}
function mailPlanModal(){const p=cur();if(!p)return;const R=planRecipients(p);
 const subj=`Terminplan ${p.name||''} – Version ${p.version||'1.0'} (Stand ${fmt(todayIso())})`;
 openModal('Terminplan per Mail',`
  <div class="f"><span class="eyebrow">Empfänger</span>${R.length?`<div class="gchips" id="mp-rc">${R.map((r,k)=>`<label title="${esc(r.email)}"><input type="checkbox" value="${esc(r.email)}" ${k<40?'checked':''}> ${esc(r.name||r.email)} <span class="muted small">· ${esc(r.role)}</span></label>`).join('')}</div>`:'<div class="muted small">Im Projekt sind noch keine E-Mail-Adressen hinterlegt (Kontakte bzw. Firmen).</div>'}</div>
  <label class="f"><span>Weitere Empfänger (mit Komma trennen)</span><input class="inp" id="mp-extra" placeholder="name@firma.ch"></label>

  <label class="f"><span>Text</span><textarea class="inp" id="mp-text" rows="11">${esc(planMailText(p))}</textarea></label>
  <div class="note">Der Terminplan wird als PDF erstellt. Wo dein Gerät es erlaubt, öffnet sich das Teilen-Fenster mit dem PDF direkt im Anhang (z.B. Outlook oder Mail). Sonst wird das PDF gespeichert und dein Mailprogramm geöffnet: dort die Datei aus dem Download-Ordner anhängen.</div>`,

/* ---------- binary helpers ---------- */
function b64bytes(bytes){let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);}
const b64u=s=>b64bytes(new TextEncoder().encode(s));
const wrap76=s=>s.replace(/.{1,76}/g,'$&\r\n');
const hdr=s=>/^[\x20-\x7e]*$/.test(s)?s:`=?UTF-8?B?${b64u(s)}?=`;
const fileSafe=s=>String(s||'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/[^\w.\- ]+/g,'').trim().replace(/\s+/g,'_').slice(0,60)||'Datei';
async function blobToBytes(b){return new Uint8Array(await b.arrayBuffer());}
async function imageBytes(im){
 if(im.url.startsWith('data:')){const b=atob(im.url.split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
 const r=await fetch(im.url);if(!r.ok)throw new Error('Bild nicht ladbar');return blobToBytes(await r.blob());
}
function buildEml(m,atts){
 const B1='=_mix_'+uid(),B2='=_alt_'+uid();
 const L=[];
 L.push('X-Unsent: 1',`To: ${hdr(m.toName)} <${m.to}>`,`Subject: ${hdr(m.subject)}`,`Date: ${new Date().toUTCString()}`,'MIME-Version: 1.0',`Content-Type: multipart/mixed; boundary="${B1}"`,'',`--${B1}`,`Content-Type: multipart/alternative; boundary="${B2}"`,'',
  `--${B2}`,'Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: base64','',wrap76(b64u(m.text)),
  `--${B2}`,'Content-Type: text/html; charset=UTF-8','Content-Transfer-Encoding: base64','',wrap76(b64u(`<!doctype html><html><head><meta charset="utf-8"></head><body>${m.html}</body></html>`)),`--${B2}--`,'');
 for(const a of atts){L.push(`--${B1}`,`Content-Type: ${a.type}; name="${a.name}"`,`Content-Disposition: attachment; filename="${a.name}"`,'Content-Transfer-Encoding: base64','',wrap76(b64bytes(a.bytes)));}

}

async function prepLogos(){for(const f of Object.values(S.firms)){const l=f.logo;if(l&&!l.startsWith('data:')&&!S.logoCache[l]){try{const b=await (await fetch(l)).blob();S.logoCache[l]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});}catch(e){}}}}

async function logoData(file){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Format'));i.src=url;});
  const sc=Math.min(1,480/img.naturalWidth,180/img.naturalHeight);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png');}finally{URL.revokeObjectURL(url);}
}
async function resizeImg(file,max=1600,q=.82){
 const url=URL.createObjectURL(file);
 try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Format nicht lesbar'));i.src=url;});
  const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(res,'image/jpeg',q));}finally{URL.revokeObjectURL(url);}
}

function moveTask(p,tid,dir){
 const flat=[];p.phases.forEach(ph=>ph.tasks.forEach((t,i)=>flat.push({ph,i})));
 const k=flat.findIndex(x=>x.ph.tasks[x.i].id===tid);const r=flat[k];
 if(dir<0){if(r.i>0){const a=r.ph.tasks;[a[r.i-1],a[r.i]]=[a[r.i],a[r.i-1]];}else{const pi=p.phases.indexOf(r.ph);if(pi>0){const t=r.ph.tasks.splice(0,1)[0];p.phases[pi-1].tasks.push(t);}}}
 else{if(r.i<r.ph.tasks.length-1){const a=r.ph.tasks;[a[r.i+1],a[r.i]]=[a[r.i],a[r.i+1]];}else{const pi=p.phases.indexOf(r.ph);if(pi<p.phases.length-1){const t=r.ph.tasks.pop();p.phases[pi+1].tasks.unshift(t);}}}
}

 hideOwn:el=>{S.hideOwn=el.checked;saveUI();render();},
 withBidders:el=>{S.withBidders=el.checked;render();},
 bidStatus:el=>{const p=cur();const[tid,fid]=el.dataset.key.split('|');const t=findTask(p,tid).t;const b=bidsOf(t).find(x=>x.firm===fid);b.status=el.value;if(el.value==='vergeben'){t.firm=fid;t.bids.forEach(x=>{if(x!==b&&x.status==='vergeben')x.status='erhalten';});}else if(t.firm===fid)t.firm='';if(el.value==='angefragt'&&!b.date)b.date=todayIso();touch(p);render();},
 bidAmount:el=>{const p=cur();const[tid,fid]=el.dataset.key.split('|');const t=findTask(p,tid).t;const b=bidsOf(t).find(x=>x.firm===fid);b.amount=el.value.trim();if(b.amount&&(!b.status||b.status==='offen'||b.status==='angefragt'))b.status='erhalten';touch(p);queueRender();},
 bidAdd:el=>{const p=cur();const t=findTask(p,el.dataset.t).t;const v=el.value;if(!v)return;
  if(v==='__new'){firmModal(null,t.gattung,f=>{const p2=cur();const t2=findTask(p2,t.id).t;bidsOf(t2).push({firm:f.id,status:'offen',date:'',amount:''});if(f.email)S.sel.add(t2.id+'|'+f.id);touch(p2);});return;}
  bidsOf(t).push({firm:v,status:'offen',date:'',amount:''});if(S.firms[v]?.email)S.sel.add(t.id+'|'+v);touch(p);render();},
 imgUpload:el=>{addImages([...el.files]);el.value='';},
 firmQ:el=>{S.firmQ=el.value;render();},showBase:el=>{S.showBase=el.checked;render();},fmLogo:async el=>{const f=el.files[0];if(!f)return;try{let d=await logoData(f);try{const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=d;});const dc=domColor(im);if(dc){const ci=$('#fm-color');ci.value=dc;ci.dataset.set=1;$('#fm-color-txt').textContent=dc+' (aus Logo)';}}catch(e){}if(Store.assets){try{const bl=await (await fetch(d)).blob();const r=await Store.assets.upload(bl,{type:'image/png'});d=r.url;}catch(e){}}S._fmLogo=d;const i=$('#fm-logo-prev');i.src=S._fmLogo;i.hidden=false;$('#fm-logo-del').hidden=false;}catch(e){toast('Bild nicht lesbar – bitte PNG oder JPG verwenden');}el.value='';},simTask:el=>{S.sim.task=el.value;render();},simKind:el=>{S.sim.kind=el.value;render();},simDelta:el=>{S.sim.delta=Math.round(+el.value||0);render();},pushFollow:el=>{S.pushFollow=el.checked;saveUI();toast(el.checked?'Folgende Gewerke werden mitverschoben':'Nur das bearbeitete Gewerk bewegt sich – Überlappungen möglich');},tplSel:el=>{S.tplSel=el.value;render();},firmG:el=>{S.firmG=el.value;render();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A'&&el.dataset.act==='mpMailto'){ACT.mpMailto();return;}if(el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el,e);});
document.addEventListener('change',e=>{
 const el=e.target;const p=cur();
 if(el.dataset.chg&&CHG[el.dataset.chg])return CHG[el.dataset.chg](el);
 if(el.dataset.ckl&&p){const x=(p.checks?.[el.dataset.ckl]||[]).find(y=>y.id===el.dataset.cki);if(!x)return;const k=el.dataset.ckk;x[k]=k==='done'?el.checked:el.value;touch(p);queueRender();return;}
 if(el.dataset.tpk){const T=curTpl();const k=el.dataset.tpk;
  if(k==='label')T.label=el.value.trim()||T.label;
  else if(k==='pname')T.phases[+el.dataset.tpp].name=el.value.trim()||'Phase';
  else{const t=T.phases[+el.dataset.tpp].tasks[+el.dataset.tpt];t[k]=k==='dur'?Math.max(0,Math.round(+el.value||0)):k==='lag'?Math.round(+el.value||0):el.value;}
  Store.saveCfg();queueRender();return;}
 if(el.dataset.cfglist){S.cfg[el.dataset.cfglist]=el.value.split('\n').map(x=>x.trim()).filter(Boolean);Store.saveCfg();return;}
 if(el.dataset.t&&el.dataset.k&&p){const t=findTask(p,el.dataset.t)?.t;if(!t)return;const k=el.dataset.k;
  if(k==='firm'){if(el.value==='__new'){el.value=t.firm||'';firmModal(null,t.gattung,f=>{const p2=cur();const t2=findTask(p2,t.id)?.t;if(t2){assignFirm(t2,f.id);touch(p2);}});return;}assignFirm(t,el.value);const fn=S.firms[el.value];if(fn)toast(`${t.name}: ${fn.name}`);}
  else if(k==='name')t.name=el.value.trim()||t.name;
  else if(k==='dur')withFollow(p,t,()=>{t.dur=Math.max(0,Math.round(+el.value||0));});
  else if(k==='prog'){if(el.value===''){t.progSet=false;}else{t.prog=Math.min(100,Math.max(0,Math.round(+el.value)));t.progSet=true;}}
  else if(k==='start'&&el.value){withFollow(p,t,()=>setStart(p,t,el.value));}
  touch(p);queueRender();return;}
 if(el.dataset.phk&&p){const ph=p.phases.find(x=>x.id===el.dataset.phid);if(ph){ph.name=el.value.trim()||ph.name;touch(p);queueRender();}return;}
 if(el.dataset.pk&&p){const k=el.dataset.pk;
  if(k==='start'&&el.value){recalc(p);const delta=workBetween(nextWork(p.start),nextWork(el.value));p.start=el.value;allTasks(p).forEach((t,i)=>{if(linkOf(t,i)==='fix')t.start=addWork(t.start,delta);});toast(delta?`Plan um ${delta} Arbeitstag${Math.abs(delta)===1?'':'e'} verschoben`:'Projektstart gesetzt');}
  else if(k==='planMode'){recalc(p);p.planMode=el.value;if(el.value==='end')p.targetEnd=p.end;if(el.value==='move')p.moveIn=addWork(p.end,1);toast(el.value==='start'?'Planung vorwärts ab Startdatum':el.value==='end'?'Fertigstellung ist jetzt fix – Plan wird rückwärts gerechnet':'Einzugstermin ist jetzt fix – Plan wird rückwärts gerechnet');}
  else if(k==='targetEnd'||k==='moveIn'){if(!el.value)return;p[k]=el.value;}
  else if(k==='leader'){p.leader=el.value;const L=leaderOf(p);p.author=L.name;p.phone='';toast('Projektleiter: '+L.name);}
  else if(k==='name'){const v=el.value.trim();if(!v){el.value=p.name;return;}if(v!==p.name){p.name=v;toast('Projekt umbenannt: '+v);}}
  else if(k==='attachPlan')p.attachPlan=el.checked;
  else p[k]=el.value;
  touch(p);queueRender();return;}
 if(el.dataset.ld){const L=leaders().find(x=>x.id===el.dataset.ld);if(L){L[el.dataset.lk]=el.dataset.lk==='signature'?el.value:el.value.trim();Store.saveCfg();if(el.dataset.lk!=='signature')queueRender();}return;}
 if(el.dataset.cfgtw){const w=clone(S.cfg.workTimes||DEFAULT_CFG.workTimes);w[el.dataset.cfgtw][+el.dataset.i]=el.value;S.cfg.workTimes=w;Store.saveCfg();toast('Standard-Zeitfenster gespeichert');return;}
 if(el.dataset.cs){S.cfg.sender={...S.cfg.sender,[el.dataset.cs]:el.value.trim()};Store.saveCfg();return;}
 if(el.dataset.cfg){const k=el.dataset.cfg;S.cfg[k]=el.type==='checkbox'?el.checked:el.value;Store.saveCfg();if(k==='holidays'||k==='extraClosed')queueRender();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.ckadd)ACT.ckAdd({dataset:{l:e.target.dataset.ckadd}});if(e.key==='Enter'&&e.target.matches('#gatNew'))ACT.gatAdd();if(e.key==='Enter'&&e.target.matches('.g-l input.ci'))e.target.blur();});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#dropzone');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#dropzone');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#dropzone');if(d){e.preventDefault();d.classList.remove('over');addImages([...e.dataTransfer.files]);}});

/* ---------- Gantt dragging ---------- */
let drag=null;
function dateAtX(x){const G=S.G,c=S.cols;if(x<=0)return c[0];let lo=0,hi=c.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(G.X[m]<=x)lo=m;else hi=m-1;}return c[lo];}
document.addEventListener('pointerdown',e=>{
 const bar=e.target.closest('[data-bar]');if(!bar||e.button!==0||!S.G)return;
 const p=cur();const t=findTask(p,bar.dataset.bar)?.t;if(!t)return;
 const G=S.G,map=S.colMap;const si=colIdx(map,t.start),ei=colIdx(map,t.end);
 const els=$$(`[data-bar="${t.id}"],[data-barl="${t.id}"]`);const segsEl=$$(`.bar[data-bar="${t.id}"]`);const first=segsEl[0],last=segsEl[segsEl.length-1];
 const sc=$('#gscroll');
 const mode=e.target.classList.contains('h')?'resize':e.target.classList.contains('hl')?'resizeL':'move';
 drag={t,x0:e.clientX,sl0:sc?sc.scrollLeft:0,sc,mode,sx:G.X[si],ex:G.X[ei]+G.Wd[ei],els,first,last,fl:first?parseFloat(first.style.left):0,fw:first?parseFloat(first.style.width):0,lw:last?parseFloat(last.style.width):0,moved:false};
 bar.setPointerCapture(e.pointerId);e.preventDefault();
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;
 const sc=drag.sc;if(sc){const r=sc.getBoundingClientRect();if(e.clientX>r.right-40)sc.scrollLeft+=18;else if(e.clientX<r.left+parseFloat(getComputedStyle(sc).getPropertyValue('--lw'))+40)sc.scrollLeft-=18;}
 const dx=e.clientX-drag.x0+((sc?sc.scrollLeft:0)-drag.sl0);if(Math.abs(dx)>3)drag.moved=true;if(!drag.moved)return;
 drag.els.forEach(el=>el.classList.add('dragging'));
 if(drag.mode==='move'){const nd=nextWork(dateAtX(drag.sx+dx+1));drag.nd=nd;const i=S.colMap.get(nd);const px=(i!=null?S.G.X[i]:drag.sx)-drag.sx;drag.els.forEach(el=>el.style.transform=`translateX(${px}px)`);}
 else if(drag.mode==='resize'){drag.ne=prevWork(dateAtX(drag.ex+dx-1));if(drag.last)drag.last.style.width=Math.max(8,drag.lw+dx)+'px';}
 else{drag.ns=nextWork(dateAtX(drag.sx+dx+1));if(drag.first){const d2=Math.min(dx,drag.fw-8);drag.first.style.left=(drag.fl+d2)+'px';drag.first.style.width=(drag.fw-d2)+'px';}}
});
document.addEventListener('pointerup',e=>{
 if(!drag)return;const d=drag;drag=null;
 if(!d.moved){taskModal(d.t.id);return;}
 const p=cur();const t=d.t;
 if(d.mode==='move'&&d.nd&&d.nd!==t.start){withFollow(p,t,()=>setStart(p,t,d.nd));touch(p);toast(`${t.name}: Start ${fmtWD(t.start)}${S.pushFollow?' – Nachfolger mitverschoben':''}`);}
 else if(d.mode==='resize'&&d.ne){const nd=Math.max(1,workBetween(t.start,d.ne)+1);if(nd!==t.dur){withFollow(p,t,()=>{t.dur=nd;});touch(p);toast(`${t.name}: ${t.dur} Arbeitstage, Ende ${fmtWD(t.end)}`);}}
 else if(d.mode==='resizeL'&&d.ns){let ns=d.ns;if(ns>t.end)ns=t.end;if(ns!==t.start){const nd=Math.max(1,workBetween(ns,t.end)+1);withFollow(p,t,()=>{setStart(p,t,ns);t.dur=nd;});touch(p);toast(`${t.name}: Start ${fmtWD(t.start)}, ${t.dur} Arbeitstage`);}}
 render();
});
document.addEventListener('pointercancel',()=>{if(drag){drag=null;render();}});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(S.tab==='plan'&&!$('#modalroot').children.length)render();},200);});

/* ---------- boot ---------- */
render();
Store.init().then(()=>{S.scrollToday=true;});
</script>
