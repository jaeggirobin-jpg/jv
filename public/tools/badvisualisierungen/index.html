<title>JV Badvisualisierungen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Übersicht als Kartenraster, Objekt als Bühne (Slider) + Spezifikation, Mockup darunter */
:root{
  --bg:#f3ede5; --fg:#2e261f; --muted:#7a6a5a; --line:#ddd0c0; --accent:#9c6b45; --chip:#e9dfd2; --card:#faf6f1;
  --display:"Fraunces",Georgia,serif; --body:"Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1814;--fg:#efe6db;--muted:#ab9a88;--line:#3b3129;--accent:#d29a6c;--chip:#2b241e;--card:#241e19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1814;--fg:#efe6db;--muted:#ab9a88;--line:#3b3129;--accent:#d29a6c;--chip:#2b241e;--card:#241e19;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.shell{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
.top img{height:34px;width:auto;background:#fff;padding:6px 10px;border-radius:4px}
.top a{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.top a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:6px 0 12px;text-wrap:balance}
.lead{color:var(--muted);max-width:56ch;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .pair{display:grid;grid-template-columns:1fr 1fr;height:220px;max-width:100%}
.card .pair img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:14px 16px 16px;display:grid;gap:2px}
.card .meta b{font-family:var(--display);font-size:20px;font-weight:600}
.card .meta span{color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:start}
.wrap.portrait{grid-template-columns:minmax(0,600px) minmax(0,1fr)}
@media (max-width:860px){.wrap,.wrap.portrait{grid-template-columns:1fr;gap:24px}}
.stage{position:relative;max-width:100%;border-radius:6px;overflow:hidden;user-select:none;touch-action:none;cursor:ew-resize;background:var(--chip)}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.stage .before{clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0)}
.handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.knob{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center}
.knob svg{width:22px;height:22px}
.tag{position:absolute;top:14px;padding:4px 10px;border-radius:3px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(30,24,20,.62);color:#fff}
.tag.l{left:14px}.tag.r{right:14px}
.range{width:100%;margin-top:14px;accent-color:var(--accent)}
.range:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
dt,dd{padding:11px 0;border-bottom:1px solid var(--line);margin:0}
dt{color:var(--muted);font-size:13px;padding-right:20px;white-space:nowrap}
dd{min-width:0}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;border:1px solid rgba(0,0,0,.12)}
.picker{margin:0 0 22px}
.picker-label{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.picker-label strong{color:var(--fg);font-weight:600;font-size:15px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;position:relative;transition:transform .15s}
.swatches button:hover{transform:scale(1.08)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:3px}
.swatches button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.swatches button.gloss::after{content:"";position:absolute;top:6px;left:8px;width:10px;height:6px;border-radius:50%;background:rgba(255,255,255,.9);transform:rotate(-30deg)}
.mock{grid-column:1/-1;margin-top:8px}
.mock img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;background:var(--chip);max-width:100%}
.note{grid-column:1/-1;margin-top:6px;font-size:13px;color:var(--muted);max-width:70ch}
@media (prefers-reduced-motion:no-preference){.stage.anim .before,.stage.anim .handle{transition:clip-path .6s ease,left .6s ease}}
</style>

<script>let OBJ=[];const TITLE="JV Badvisualisierungen";let IMG={};const SRC=(id,k)=>IMG['img/'+id+'/'+k+'.jpg'];
const $=s=>document.querySelector(s);
const app=$('#app');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function img(o,key){return SRC(o.id,key)}
function list(){
  document.title=TITLE;
  app.innerHTML=`<div class="eyebrow">Jäggi Vollmer · Badplanung</div><h1>Badvisualisierungen</h1>
  <p class="lead">Vorher/Nachher je Objekt. Karte öffnen, Regler ziehen, Farben vergleichen.</p>
  <div class="grid">${OBJ.map(o=>`<a class="card" href="#${o.id}"><div class="pair"><img src="${img(o,'vorher')}" alt=""><img src="${img(o,'room-'+o.varianten[o.start||0].id)}" alt=""></div>
  <div class="meta"><b>${esc(o.kunde)}</b><span>${esc(o.raum)} · ${esc(o.datum)}</span></div></a>`).join('')}</div>`;
  window.scrollTo(0,0);
}
function detail(o){
  document.title=o.kunde+' · '+o.raum;
  const v0=o.varianten[o.start||0];
  const multi=o.varianten.length>1;
  app.innerHTML=`<div class="wrap ${o.aspect==='3/4'?'portrait':''}">
   <div><div class="stage anim" id="stage" style="--pos:50%;aspect-ratio:${o.aspect}">
     <img id="after" src="${img(o,'room-'+v0.id)}" alt="Nachher">
     <img class="before" src="${img(o,'vorher')}" alt="Vorher">
     <div class="handle"><div class="knob"><svg viewBox="0 0 24 24" fill="none" stroke="#2e261f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></div></div>
     <span class="tag l">Vorher</span><span class="tag r">Nachher</span></div>
     <input class="range" id="range" type="range" min="0" max="100" value="50" aria-label="Vorher/Nachher-Regler"></div>
   <div><div class="eyebrow">${esc(o.raum)} · ${esc(o.kunde)}</div><h1>${esc(o.titel)}</h1><p class="lead">${esc(o.lead)}</p>
    ${multi?`<div class="picker"><div class="picker-label">Keramikfarbe <strong id="cname"></strong> <span id="cfin"></span></div><div class="swatches" id="sw" role="group" aria-label="Keramikfarbe wählen"></div></div>`:''}
    <dl>${o.spec.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl></div>
   <div class="mock"><img id="mock" src="${img(o,'mock-'+v0.id)}" alt="Mockup der Teile"></div>
   <p class="note">${esc(o.hinweis)}</p></div>`;
  const st=$('#stage'),rg=$('#range');
  const set=(p,a)=>{p=Math.max(0,Math.min(100,p));st.classList.toggle('anim',!!a);st.style.setProperty('--pos',p+'%');rg.value=p};
  const fx=e=>{const r=st.getBoundingClientRect();return (e.clientX-r.left)/r.width*100};
  let drag=false;
  st.addEventListener('pointerdown',e=>{drag=true;st.setPointerCapture(e.pointerId);set(fx(e),true)});
  st.addEventListener('pointermove',e=>{if(drag)set(fx(e),false)});
  st.addEventListener('pointerup',()=>drag=false);st.addEventListener('pointercancel',()=>drag=false);
  rg.addEventListener('input',()=>set(+rg.value,false));
  if(multi){const sw=$('#sw');
    const pick=id=>{const c=o.varianten.find(x=>x.id===id);$('#after').src=img(o,'room-'+id);$('#mock').src=img(o,'mock-'+id);
      $('#cname').textContent=c.name;$('#cfin').textContent=c.glossy?'glänzend':'matt';
      sw.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));
      try{localStorage.setItem('farbe-'+o.id,id)}catch(e){}};
    o.varianten.forEach(c=>{const b=document.createElement('button');b.type='button';b.dataset.id=c.id;b.style.background=c.swatch;b.title=c.name+(c.glossy?' (glänzend)':' (matt)');b.setAttribute('aria-label',b.title);if(c.glossy)b.classList.add('gloss');b.onclick=()=>pick(c.id);sw.appendChild(b)});
    let s=v0.id;try{const x=localStorage.getItem('farbe-'+o.id);if(x&&o.varianten.some(c=>c.id===x))s=x}catch(e){}
    pick(s);}
  window.scrollTo(0,0);
}
function route(){const id=location.hash.slice(1);const o=OBJ.find(x=>x.id===id);
  $('#back').hidden=!o||OBJ.length<2; if(o)detail(o);else list();}
window.addEventListener('hashchange',route);JVBadvis.laden(function(d){OBJ=d.objekte;IMG=d.bilder;route();JVBadvis.hinweis(OBJ);});
</script>
