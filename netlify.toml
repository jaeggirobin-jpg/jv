[build]
  functions = "netlify/functions"
  # Nur der Ordner public/ wird ausgeliefert. Doku, SQL-Migrationen und
  # Quellcode der Functions bleiben damit privat.
  publish = "public"

# Redirects: saubere URLs für die Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # Tokens stehen in der URL: nie als Referrer weitergeben
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache-Header für HTML-Dateien (nie cachen, sofort neue Version)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

# PDFs sollen nie indexiert werden
[[headers]]
  for = "/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
