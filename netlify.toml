[build]
  functions = "netlify/functions"
  # Nur der Ordner public/ wird ausgeliefert. Doku, SQL-Migrationen und
  # Quellcode der Functions bleiben damit privat.
  publish = "public"

# Drohnen-Check: Subdomain dachcheck.jaeggivollmer.ch zeigt auf public/dachcheck/.
# Muss VOR der allgemeinen /api/*-Regel stehen (erste passende Regel gewinnt).
# Auf dieser Subdomain ist nur der Drohnen-Check erreichbar (Seite, Anfrage-Übersicht admin.html
# und die dachcheck-Functions), nicht das Admin-Panel oder der Katalog.
[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/api/dachcheck-anfrage"
  to = "/.netlify/functions/dachcheck-anfrage"
  status = 200
  force = true

[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/api/dachcheck-warteliste"
  to = "/.netlify/functions/dachcheck-warteliste"
  status = 200
  force = true

[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/api/dachcheck-admin-liste"
  to = "/.netlify/functions/dachcheck-admin-liste"
  status = 200
  force = true

[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/api/dachcheck-admin-update"
  to = "/.netlify/functions/dachcheck-admin-update"
  status = 200
  force = true

[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/api/dachcheck-bericht"
  to = "/.netlify/functions/dachcheck-bericht"
  status = 200
  force = true

[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/api/dachcheck-bericht-ansehen"
  to = "/.netlify/functions/dachcheck-bericht-ansehen"
  status = 200
  force = true

[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/api/dachcheck-medien"
  to = "/.netlify/functions/dachcheck-medien"
  status = 200
  force = true

[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/api/dachcheck-admin-medien"
  to = "/.netlify/functions/dachcheck-admin-medien"
  status = 200
  force = true

[[redirects]]
  from = "https://dachcheck.jaeggivollmer.ch/*"
  to = "/dachcheck/:splat"
  status = 200
  force = true

# KRV-Check: Subdomain krv.jaeggivollmer.ch zeigt auf public/krv/ (gleiches Muster wie der Drohnen-Check).
# Erreichbar sind nur die KRV-Seiten, die krv-Functions und die gemeinsamen Dateien des Drohnen-Checks
# (Schriften, Grundgestaltung, Logo, Video-Verkleinerung unter /dachcheck/assets/).
[[redirects]]
  from = "https://krv.jaeggivollmer.ch/api/krv-anfrage"
  to = "/.netlify/functions/krv-anfrage"
  status = 200
  force = true

[[redirects]]
  from = "https://krv.jaeggivollmer.ch/api/krv-fotos"
  to = "/.netlify/functions/krv-fotos"
  status = 200
  force = true

[[redirects]]
  from = "https://krv.jaeggivollmer.ch/api/krv-medien"
  to = "/.netlify/functions/krv-medien"
  status = 200
  force = true

[[redirects]]
  from = "https://krv.jaeggivollmer.ch/api/krv-admin-liste"
  to = "/.netlify/functions/krv-admin-liste"
  status = 200
  force = true

[[redirects]]
  from = "https://krv.jaeggivollmer.ch/api/krv-admin-anfrage"
  to = "/.netlify/functions/krv-admin-anfrage"
  status = 200
  force = true

[[redirects]]
  from = "https://krv.jaeggivollmer.ch/api/krv-admin-medien"
  to = "/.netlify/functions/krv-admin-medien"
  status = 200
  force = true

[[redirects]]
  from = "https://krv.jaeggivollmer.ch/dachcheck/assets/*"
  to = "/dachcheck/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://krv.jaeggivollmer.ch/*"
  to = "/krv/:splat"
  status = 200
  force = true

# Redirects: saubere URLs für die Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Drohnen-Check: Anfragen ohne Auftrag (mit Bericht und Bildern) täglich nach 60 Tagen löschen
[functions."dachcheck-loeschroutine"]
  schedule = "@daily"

# KRV-Check: Anfragen ohne Auftrag (mit Fotos) täglich nach 90 Tagen löschen, verpasste Info-Mails nachholen
[functions."krv-loeschroutine"]
  schedule = "@daily"

# Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # Tokens stehen in der URL: nie als Referrer weitergeben
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache-Header für HTML-Dateien (nie cachen, sofort neue Version)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

# PDFs sollen nie indexiert werden
[[headers]]
  for = "/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
