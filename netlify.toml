[build]
  functions = "netlify/functions"
  publish = "."

# Redirects: saubere URLs für die Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Cache-Header für HTML-Dateien (nie cachen, sofort neue Version)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"

# Sicherheits-Header für den Kunden-Viewer
[[headers]]
  for = "/view.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Sicherheits-Header für die Inspiration-Seite
[[headers]]
  for = "/inspiration.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# PDFs sollen nie indexiert werden
[[headers]]
  for = "/*.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
